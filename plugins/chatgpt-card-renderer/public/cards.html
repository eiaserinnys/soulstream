@layer base {
  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    overflow: hidden;
    background: var(--background);
  }
  ::-webkit-scrollbar {
    width: 6px;
  }
  ::-webkit-scrollbar-track {
    background: transparent;
  }
  ::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }
  ::-webkit-scrollbar-thumb:hover {
    background: var(--muted-foreground);
  }
}
@keyframes lg-pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.35;
  }
}
@keyframes node-shimmer {
  0% {
    background-position: -200px 0;
  }
  100% {
    background-position: 200px 0;
  }
}
@keyframes tool-call-pulse {
  0%, 100% {
    border-color: color-mix(in srgb, var(--node-tool) 30%, transparent);
  }
  50% {
    border-color: color-mix(in srgb, var(--node-tool) 70%, transparent);
  }
}
@keyframes pulse-border-pink {
  0%, 100% {
    border-color: color-mix(in srgb, var(--node-input-request) 30%, transparent);
  }
  50% {
    border-color: color-mix(in srgb, var(--node-input-request) 70%, transparent);
  }
}
.animate-pulse-border-pink {
  animation: pulse-border-pink 2s ease-in-out infinite;
}
@keyframes message-enter {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.message-enter {
  animation: message-enter 180ms ease-out;
}
@keyframes caret-blink {
  0%, 50% {
    opacity: 1;
  }
  51%, 100% {
    opacity: 0;
  }
}
.animate-caret-blink {
  animation: caret-blink 1s steps(2, end) infinite;
}
@keyframes wallpaper-drift {
  0% {
    transform: translate(0, 0) scale(1);
  }
  50% {
    transform: translate(var(--dx), calc(var(--dy) * -0.6)) scale(1.08);
  }
  100% {
    transform: translate(calc(var(--dx) * -0.7), var(--dy)) scale(0.94);
  }
}
.chat-message-selectable {
  -webkit-user-select: text;
  user-select: text;
}
[data-slot="chat-body"], [data-slot="chat-body"] p, [data-slot="chat-body"] li, [data-slot="chat-body"] table, [data-slot="chat-tool-body"], [data-slot="chat-input-body"] {
  font-size: var(--chat-font-size);
  line-height: var(--chat-line-height);
}
[data-slot="chat-input-composer"] {
  --chat-composer-control-size: calc(var(--spacing) * 8);
}
[data-slot="chat-input-editor"] textarea {
  display: block;
  min-height: var(--chat-composer-control-size);
  padding-block: max(0px, calc((var(--chat-composer-control-size) - var(--chat-line-height)) / 2));
  scrollbar-width: none;
}
[data-slot="chat-input-editor"] textarea::-webkit-scrollbar {
  display: none;
}
[data-slot="chat-input-composer"] > button {
  width: var(--chat-composer-control-size);
  height: var(--chat-composer-control-size);
}
[data-slot="chat-input-mode"] {
  height: var(--chat-composer-control-size);
}
:root {
  --control-surface: var(--background);
  @supports (color: color-mix(in lab, red, red)) {
    --control-surface: color-mix(in srgb, var(--background) 48%, transparent);
  }
}
.control-surface {
  background: var(--control-surface);
}
.control-surface:is(:disabled, [data-disabled], :has(:disabled)) {
  opacity: 1;
}
.control-surface:disabled, .control-surface[data-disabled], .control-surface :disabled {
  color: var(--muted-foreground);
  cursor: default;
}
.control-surface[data-liquid-glass-webgl="true"] {
  background: transparent;
}
.control-surface[data-liquid-glass-webgl="true"]::before {
  background: var(--control-surface);
  opacity: 1;
}
[data-slot="tool-call-group-toggle"] {
  font-size: 12px;
  line-height: 18px;
}
pre[data-markdown-code-layout="document"] {
  max-height: none;
  overflow: visible;
}
.mobile-tabs [data-slot="tabs-content"] {
  transition: opacity 180ms ease-out;
}
.mobile-tabs [data-slot="tabs-content"][hidden] {
  display: block;
  opacity: 0;
  pointer-events: none;
  visibility: hidden;
  position: absolute;
  inset: 0;
}
.mobile-tabs [data-slot="tabs-content"]:not([hidden]) {
  visibility: visible;
}
.folder-stack {
  display: flex;
  width: 200%;
  height: 100%;
  transform: translateX(0);
  transition: transform 220ms ease-out;
}
.folder-stack.show-content {
  transform: translateX(-50%);
}
.folder-stack > .folder-panel {
  flex: 0 0 50%;
  height: 100%;
  overflow: hidden;
}
@media (prefers-reduced-motion: reduce) {
  .message-enter {
    animation: none;
  }
  .animate-caret-blink {
    animation: none;
    opacity: 1;
  }
  .mobile-tabs [data-slot="tabs-content"] {
    transition: none;
  }
  .folder-stack {
    transition: none;
  }
  .mobile-tabs [data-slot="tab-indicator"] {
    transition: none;
  }
  .wallpaper-bokeh i {
    animation: none;
  }
}
@keyframes card-running-breathe {
  0%, 100% {
    background-color: color-mix(in srgb, var(--card) 100%, var(--color-success) 0%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-success) 12%, transparent);
  }
  50% {
    background-color: color-mix(in srgb, var(--card) 93%, var(--color-success) 7%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-success) 50%, transparent), 0 0 14px color-mix(in srgb, var(--color-success) 14%, transparent);
  }
}
@keyframes card-running-breathe-tint {
  0%, 100% {
    background-color: color-mix(in srgb, var(--card) 96%, var(--color-success) 4%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-success) 12%, transparent);
  }
  50% {
    background-color: color-mix(in srgb, var(--card) 93%, var(--color-success) 7%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--color-success) 50%, transparent), 0 0 14px color-mix(in srgb, var(--color-success) 14%, transparent);
  }
}
@keyframes card-running-breathe-active {
  0%, 100% {
    background-color: color-mix(in srgb, var(--card) 96%, var(--color-success) 4%);
    box-shadow: 0 0 0 1.5px var(--color-success), 0 0 0px transparent;
  }
  50% {
    background-color: color-mix(in srgb, var(--card) 93%, var(--color-success) 7%);
    box-shadow: 0 0 0 1.5px var(--color-success), 0 0 14px color-mix(in srgb, var(--color-success) 14%, transparent);
  }
}
@keyframes card-running-shimmer {
  0% {
    transform: translateX(-100%);
  }
  60% {
    transform: translateX(100%);
  }
  100% {
    transform: translateX(100%);
  }
}
@layer components {
  .shimmer-purple {
    background: linear-gradient(90deg, transparent 0%, var(--node-thinking) 50%, transparent 100%);
    @supports (color: color-mix(in lab, red, red)) {
      background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--node-thinking) 6%, transparent) 50%, transparent 100%);
    }
    background-size: 200px 100%;
    animation: node-shimmer 1.5s infinite linear;
  }
  .shimmer-cyan {
    background: linear-gradient(90deg, transparent 0%, var(--node-plan) 50%, transparent 100%);
    @supports (color: color-mix(in lab, red, red)) {
      background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--node-plan) 6%, transparent) 50%, transparent 100%);
    }
    background-size: 200px 100%;
    animation: node-shimmer 1.5s infinite linear;
  }
  .shimmer-green {
    background: linear-gradient(90deg, transparent 0%, var(--node-response) 50%, transparent 100%);
    @supports (color: color-mix(in lab, red, red)) {
      background: linear-gradient(90deg, transparent 0%, color-mix(in srgb, var(--node-response) 6%, transparent) 50%, transparent 100%);
    }
    background-size: 200px 100%;
    animation: node-shimmer 1.5s infinite linear;
  }
  .card-running-base::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient( 105deg, transparent 30%, var(--color-success) 50%, transparent 70% );
    @supports (color: color-mix(in lab, red, red)) {
      background: linear-gradient( 105deg, transparent 30%, color-mix(in srgb, var(--color-success) 10%, transparent) 50%, transparent 70% );
    }
    transform: translateX(-100%);
    animation: card-running-shimmer 2.8s ease-in-out infinite;
    pointer-events: none;
  }
  .card-running {
    animation: card-running-breathe 3s ease-in-out infinite;
  }
  .card-running-unread {
    animation: card-running-breathe-tint 3s ease-in-out infinite;
  }
  .card-running-active {
    animation: card-running-breathe-active 3s ease-in-out infinite;
  }
}
@layer components;
@layer utilities {
  .line-clamp-2 {
    overflow: hidden;
    text-overflow: ellipsis;

  }

.v3-card-question {
  display: flex;
  flex-direction: column;
  gap: var(--v3-space-2);
  font: var(--v3-type-body) var(--v3-font-family);
}
.v3-card-answer-options {
  display: flex;
  flex-wrap: wrap;
  gap: var(--v3-space-2);
}
.v3-card-request {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: var(--v3-type-body) var(--v3-font-family);
}
.v3-card-dispatch {
  display: flex;
  flex-direction: column;
  gap: var(--v3-space-4);
  font: var(--v3-type-body) var(--v3-font-family);
}
.v3-card-dispatch label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--v3-space-4);
}
.v3-card-dispatch input {
  max-width: calc(var(--v3-action-size) * 3);
}
.v3-shell .v3-planner-scroll:has(> .v3-planner-column--daily) {
  overflow: hidden;
  scrollbar-gutter: auto;
  padding: 0 var(--v3-space-6) var(--v3-space-5);
}
.v3-shell .v3-planner-column--daily {
  display: flex;
  flex-direction: column;
  height: 100%;
  width: 100%;
  max-width: var(--v3-content-max-width);
  margin-inline: auto;
  min-height: 0;
}
.v3-today-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: none;
  padding-bottom: var(--v3-space-5);
}
.v3-today-list::-webkit-scrollbar {
  display: none;
}
.v3-shell .v3-today-list > .v3-date-head {
  margin: 0 0 var(--v3-space-5);
  gap: var(--v3-space-3);
}
.v3-shell .v3-today-list .v3-daily-memo {
  min-height: var(--v3-control-height);
  padding: 0 var(--v3-space-3);
  border-radius: var(--v3-space-4);
  justify-content: center;
  margin-bottom: var(--v3-space-5);
}
.v3-shell .v3-card-inbox {
  gap: var(--v3-space-5);
}
.v3-shell .v3-card-inbox > section {
  gap: var(--v3-space-2);
  margin: 0;
}
.v3-shell .v3-card-inbox .v3-section-head {
  margin: 0;
  gap: var(--v3-space-2);
  justify-content: flex-start;
}
.v3-shell .v3-card-inbox .v3-task-list {
  gap: var(--v3-space-2);
  padding-top: 0;
}
.v3-card-inbox-empty {
  display: flex;
  flex-direction: column;
  gap: var(--v3-space-1);
  border: thin dashed var(--v3-stroke-default);
  border-radius: var(--v3-space-4);
  padding: var(--v3-space-7) var(--v3-space-4);
  text-align: center;
  color: var(--v3-text-tertiary);
  font: var(--v3-type-meta) var(--v3-font-family);
}
.v3-card-inbox-empty strong {
  color: var(--v3-text-secondary);
  font: var(--v3-type-side-title) var(--v3-font-family);
}
.v3-today-handoff {
  flex: none;
  border-top: thin solid var(--v3-stroke-default);
  padding-top: var(--v3-space-3);
}
.v3-card-handoff {
  display: flex;
  flex-direction: column;
  gap: var(--v3-space-2);
}
.v3-card-handoff-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--v3-card-gap);
  min-width: 0;
}
.v3-shell .v3-card-handoff-chip {
  display: inline-flex;
  flex: none;
  min-width: 0;
  align-items: center;
  gap: var(--v3-card-gap);
  height: var(--v3-space-7);
  padding: 0 calc(var(--v3-space-2) + var(--v3-space-2) / 4);
  border: thin solid var(--v3-stroke-default);
  color: var(--v3-text-secondary);
  cursor: pointer;
  font: var(--v3-type-meta) var(--v3-font-family);
  font-size: calc(var(--font-size-xs) + var(--v3-space-2) / 8);
  white-space: nowrap;
  max-width: 100%;
}
.v3-card-handoff-chip > span:first-child {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.v3-shell .v3-card-handoff-folder {
  max-width: min(100%, calc(var(--v3-control-height) * 3 + var(--v3-space-8)));
  color: var(--v3-text-primary);
}
.v3-shell .v3-card-handoff-execution {
  flex-shrink: 1;
}
@media (max-width: 760px) {
  .v3-shell .v3-planner-scroll:has(> .v3-planner-column--daily) {
    padding-inline: var(--v3-space-3);
    padding-bottom: var(--v3-space-3);
  }
  .v3-shell .v3-card-handoff-execution {
    flex: 1;
  }
  .v3-shell .v3-today-list > .v3-date-head {
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
  }
  .v3-today-list .v3-date-head p {
    flex-basis: 100%;
    order: 1;
  }
}
.v3-card-add > [data-slot="input-control"] {
  flex: 1;
  min-width: 0;
}
.v3-card-avatar-link {
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  flex: none;
}
.v3-card-row[data-blocked-kind="question"] .v3-card-status--blocked {
  color: var(--v3-favorite);
}
.v3-card-timeline {
  display: flex;
  flex-direction: column;
  gap: var(--v3-space-4);
}
.v3-card-bubble-kind {
  display: flex;
  gap: var(--v3-space-2);
  align-items: baseline;
  color: var(--v3-text-secondary);
  font: var(--v3-type-meta) var(--v3-font-family);
}
.v3-card-bubble-kind strong {
  font-weight: 700;
}
.v3-card-bubble-kind time {
  margin-left: auto;
  color: var(--v3-text-tertiary);
}
.v3-card-three-lines {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.v3-card-report-title {
  font: inherit;
  font-weight: 600;
}
.v3-card-report-thumbnails {
  display: flex;
  flex-wrap: wrap;
  gap: var(--v3-space-2);
}
.v3-card-more, .v3-card-other > summary {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--v3-text-tertiary);
  font: var(--v3-type-meta) var(--v3-font-family);
  cursor: pointer;
}
.v3-card-comment-dock {
  flex: none;
}
.v3-card-inbox .v3-section-head > .dashboard-icon-cap {
  margin-left: auto;
}
.v3-card-create-form {
  display: flex;
  flex-direction: column;
  gap: var(--v3-space-2);
  padding: var(--v3-space-3);
  background: var(--v3-glass-card);
  border-radius: var(--v3-space-4);
}
.v3-shell.v3-card-folder-picker {
  width: calc(var(--v3-session-meta-column) * 5 + var(--v3-space-5));
}
.v3-shell.v3-card-execution-picker {
  width: calc(var(--v3-session-meta-column) * 8 + var(--v3-space-2));
}
.v3-shell.v3-card-folder-picker, .v3-shell.v3-card-execution-picker {
  display: flex;
  grid-template-columns: none;
  height: auto;
  max-width: 100%;
  max-height: 60vh;
  border-radius: calc(var(--v3-space-7) / 2);
  background: var(--v3-glass-dense);
  --glass-chrome-surface: var(--v3-glass-dense);
}
.v3-card-execution-columns {
  display: grid;
  grid-template-columns: repeat(3,minmax(0,1fr));
  gap: var(--v3-space-3);
}
.v3-card-execution-columns section {
  min-width: 0;
}
.v3-card-execution-columns h3 {
  font: var(--v3-type-meta) var(--v3-font-family);
  font-weight: 700;
  color: var(--v3-text-tertiary);
  margin: 0 0 var(--v3-space-2);
}
.v3-card-execution-columns button {
  display: flex;
  width: 100%;
  align-items: center;
  min-width: 0;
  height: var(--v3-space-8);
  gap: var(--v3-space-2);
  padding: 0 var(--v3-space-2);
  background: transparent;
  border: 0;
  border-radius: var(--v3-space-2);
  color: var(--v3-text-secondary);
  font: var(--v3-type-body) var(--v3-font-family);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
  cursor: pointer;
}
.v3-card-execution-columns button > span:last-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.v3-card-execution-columns button[aria-pressed="true"] {
  color: var(--v3-accent);
  background: var(--v3-accent);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb,var(--v3-accent) 16%,transparent);
  }
}
.v3-card-execution-columns button:disabled {
  opacity: .4;
  cursor: default;
}
.v3-card-picker-avatar {
  width: var(--v3-space-5);
  height: var(--v3-space-5);
  flex: none;
}
.v3-card-picker-avatar > * {
  width: 100%;
  height: 100%;
  border-radius: 50%;
}
@media (max-width: 760px) {
  .v3-card-execution-columns {
    grid-template-columns: minmax(0,1fr);
  }
}
.v3-card-collapse-hint {
  display: block;
  color: var(--v3-text-tertiary);
  font: var(--v3-type-meta) var(--v3-font-family);
}
.v3-card-create-form textarea {
  width: 100%;
  min-width: 0;
  resize: none;
  border: 0;
  padding: 0;
  outline: none;
  background: transparent;
  color: var(--v3-text-primary);
  font: var(--v3-type-body) var(--v3-font-family);
  scrollbar-width: none;
}
.v3-card-detail > .v3-card-panel-scroll {
  flex: 1;
  min-height: 0;
}
.v3-card-tabs {
  flex: none;
  padding-block: var(--v3-space-3);
}
.v3-card-composer-slot {
  flex: none;
  min-width: 0;
}
.v3-card-context {
  flex: none;
  min-width: 0;
  padding-top: var(--v3-space-6);
}
.v3-card-composer-slot > .v3-card-comment-dock {
  box-sizing: border-box;
  min-width: 0;
  padding-inline: var(--v3-detail-inline-inset);
  padding-bottom: var(--v3-space-4);
}
.v3-context-picker {
  margin-top: 10px;
  overflow: hidden;
  border: 1px solid var(--glass-border);
  border-radius: 13px;
  background: var(--card);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--card) 94%, transparent);
  }
  box-shadow: var(--md-shadow);
}
.v3-run-move-picker {
  margin-top: 0;
  box-shadow: none;
}
.v3-context-inherited {
  padding: 12px;
  background: var(--info);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--info) 7%, transparent);
  }
}
.v3-context-inherited > strong {
  display: block;
  margin-bottom: 7px;
  color: var(--muted-foreground);
  font-size: var(--font-size-xs);
  letter-spacing: .035em;
  text-transform: uppercase;
}
.v3-context-inherited > div {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.v3-context-inherited span {
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  padding: 4px 7px;
  color: var(--muted-foreground);
  background: var(--background);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--background) 58%, transparent);
  }
  font-size: var(--font-size-xs);
}
.v3-context-inherited small {
  color: var(--muted-foreground);
  font-size: var(--font-size-xs);
}
.v3-context-tabs {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.v3-context-tabs button {
  min-width: 0;
  border: 0;
  border-right: 1px solid var(--border);
  padding: 9px 3px;
  color: var(--muted-foreground);
  background: transparent;
  font-size: var(--font-size-xs);
  font-weight: 780;
  cursor: pointer;
}
.v3-context-tabs button:last-child {
  border-right: 0;
}
.v3-context-tabs button.is-active {
  color: var(--foreground);
  background: var(--info);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--info) 10%, transparent);
  }
  box-shadow: inset 0 -2px var(--info);
}
.v3-context-tabs small {
  margin-left: 3px;
  border-radius: 999px;
  padding: 1px 3px;
  color: var(--info-foreground);
  background: var(--info);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--info) 13%, transparent);
  }
  font-size: var(--font-size-xs);
}
.v3-context-panel {
  display: flex;
  min-height: 120px;
  flex-direction: column;
  gap: 7px;
  padding: 10px;
}
.v3-context-panel > input, .v3-succession-assignment select {
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
  color: var(--foreground);
  background: var(--background);
  font: inherit;
  font-size: var(--font-size-xs);
}
.v3-context-panel input:focus-visible, .v3-succession-assignment select:focus-visible {
  border-color: var(--info);
  outline: none;
  box-shadow: 0 0 0 3px var(--info);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--info) 18%, transparent);
  }
}
.v3-context-options {
  display: flex;
  max-height: 190px;
  overflow-y: auto;
  flex-direction: column;
  gap: 5px;
}
.v3-context-options > p {
  color: var(--muted-foreground);
  font-size: var(--font-size-xs);
}
.v3-context-option {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 8px;
  color: var(--foreground);
  background: var(--background);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--background) 72%, transparent);
  }
  text-align: left;
  cursor: pointer;
}
.v3-context-option:hover:not(:disabled), .v3-context-option.is-selected {
  border-color: var(--info);
  @supports (color: color-mix(in lab, red, red)) {
    border-color: color-mix(in srgb, var(--info) 60%, var(--border));
  }
  background: var(--info);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--info) 10%, transparent);
  }
}
.v3-context-option:disabled {
  opacity: .55;
  cursor: default;
}
.v3-context-option--selected {
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  cursor: default;
}
.v3-context-option-settings {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--muted-foreground);
  font-size: var(--font-size-xs);
}
.v3-context-option-settings label {
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}
.v3-context-option-settings select {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 5px;
  color: var(--foreground);
  background: var(--background);
  font: inherit;
}
.v3-context-option-settings input[type="number"] {
  width: 64px;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 5px;
  color: var(--foreground);
  background: var(--background);
  font: inherit;
}
.v3-context-option-settings select:focus-visible, .v3-context-option-settings input[type="number"]:focus-visible {
  border-color: var(--info);
  outline: none;
  box-shadow: 0 0 0 3px var(--info);
  @supports (color: color-mix(in lab, red, red)) {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--info) 18%, transparent);
  }
}
.v3-context-option-settings input {
  accent-color: var(--info);
}
.v3-context-remove {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  border: 0;
  border-radius: 7px;
  color: var(--destructive);
  background: var(--destructive);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--destructive) 9%, transparent);
  }
  cursor: pointer;
}
.v3-context-remove:hover:not(:disabled) {
  background: var(--destructive);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--destructive) 18%, transparent);
  }
}
.v3-context-remove:disabled {
  opacity: .5;
  cursor: default;
}
.v3-context-option > span:nth-child(2) {
  display: flex;
  min-width: 0;
  flex-direction: column;
}
.v3-context-option strong {
  overflow: hidden;
  font-size: var(--font-size-xs);
  text-overflow: ellipsis;
  white-space: nowrap;
}
.v3-context-option small {
  color: var(--muted-foreground);
  font-size: var(--font-size-xs);
}
.v3-context-option i {
  width: 25px;
  height: 14px;
  border-radius: 999px;
  background: var(--muted);
  box-shadow: inset 0 0 0 1px var(--border);
}
.v3-context-option i::after {
  display: block;
  width: 10px;
  height: 10px;
  margin: 2px;
  border-radius: 50%;
  background: var(--muted-foreground);
  content: "";
  transition: transform .15s ease;
}
.v3-context-option.is-selected i {
  background: var(--info);
}
.v3-context-option.is-selected i::after {
  background: var(--info-foreground);
  transform: translateX(11px);
}
.v3-new-task-context {
  display: grid;
  gap: 8px;
}
.v3-new-task-context-head {
  display: flex;
  align-items: center;
  gap: 12px;
}
.v3-new-task-context-head > span {
  display: grid;
  min-width: 0;
  flex: 1;
  gap: 2px;
  font-size: var(--font-size-xs);
}
.v3-new-task-context-head small, .v3-initial-guidance > span {
  color: var(--muted-foreground);
  font-size: var(--font-size-xs);
}
.v3-context-picker--initial {
  margin-top: 0;
}
.v3-initial-guidance {
  display: grid;
  gap: 5px;
}
.v3-initial-guidance textarea {
  min-height: 88px;
  resize: vertical;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 9px;
  color: var(--foreground);
  background: var(--background);
  font: inherit;
  font-size: var(--font-size-xs);
  line-height: 1.5;
}
.v3-context-error {
  margin: 0 10px 8px;
  border: 1px solid var(--destructive);
  @supports (color: color-mix(in lab, red, red)) {
    border: 1px solid color-mix(in srgb, var(--destructive) 35%, var(--border));
  }
  border-radius: 8px;
  padding: 7px 9px;
  color: var(--destructive);
  background: var(--destructive);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--destructive) 7%, transparent);
  }
  font-size: var(--font-size-xs);
}
.v3-succession-error {
  margin-top: 10px;
}
.v3-context-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  border-top: 1px solid var(--border);
  padding: 9px 10px;
}
.v3-context-footer span {
  min-width: 0;
  flex: 1;
  color: var(--muted-foreground);
  font-size: var(--font-size-xs);
}
.v3-succession-head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid var(--border);
  padding: 15px 52px 15px 17px;
}
.v3-succession-head > span {
  display: grid;
  width: 34px;
  height: 34px;
  place-items: center;
  border-radius: 10px;
  color: var(--info-foreground);
  background: var(--info);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--info) 13%, transparent);
  }
  font-size: 18px;
}
.v3-succession-modal h2, .v3-succession-modal p {
  margin: 0;
}
.v3-succession-modal h2 {
  font-size: var(--font-size-xl);
  line-height: var(--font-size-xl--line-height);
}
.v3-succession-head p {
  margin-top: 3px;
  color: var(--muted-foreground);
  font-size: var(--font-size-sm);
}
.v3-succession-body {
  padding: 16px 18px;
}
.v3-succession-body ol {
  display: flex;
  flex-direction: column;
  gap: 7px;
  margin: 11px 0;
  padding: 0;
  list-style: none;
}
.v3-succession-body li {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--background);
  @supports (color: color-mix(in lab, red, red)) {
    background: color-mix(in srgb, var(--background) 72%, transparent);
  }
}
.v3-succession-body li label {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  padding: 10px;
  cursor: pointer;
}
