schema_version: 1

# Node-local opt-in groups. A preset without `group` is always available; a
# preset with `group` is advertised only when the node enables that group.
groups: [china]

presets:
  - id: claude-haiku
    label: Claude - Haiku
    backend: claude
    model: haiku
  - id: claude-sonnet
    label: Claude - Sonnet
    backend: claude
    model: sonnet
    supported_efforts: [low, medium, high, xhigh, max]
    default_effort: xhigh
  - id: claude-sonnet-trusted
    label: Claude - Sonnet (상자 밖, 배달과 운영 조사)
    backend: claude
    model: sonnet
    supported_efforts: [low, medium, high, xhigh, max]
    default_effort: xhigh
    trusted_execution: true
    # 카드 #1292 디렉터 결정(261113): 배달원(bubbles)과 운영 조사(blossom) 자리에만 쓰는 상자 밖 Sonnet이다.
    # claude-sonnet은 상자 안 그대로 둔다. 모델과 요율, 계정 풀은 claude-sonnet과 같다.
    # 되돌림: 이 프리셋 세션이 맡은 일 밖의 프로세스 종료, 서비스 재시작, 승인 없는 배포 같은 사고를 내면
    # 이 항목의 trusted_execution을 거두고, 두 자리를 원래 모델(codex-6.1-sol, 코덱스 한도 동안 claude-opus high)로
    # 되돌린다. atom 공통 node-model-selection의 「코덱스 불가 시 대체 위임」과 서소영 카드 담당 rules도 함께 되돌린다.
  - id: claude-opus
    label: Claude - Opus
    backend: claude
    model: opus
    supported_efforts: [low, medium, high, xhigh, max]
    default_effort: xhigh
    trusted_execution: true
  - id: claude-opus-lean
    label: Claude - Opus (담당 시범, 압축 25만)
    backend: claude
    model: "claude-opus-5-5[1m]"
    usage_model_id: opus
    supported_efforts: [low, medium, high, xhigh, max]
    default_effort: xhigh
    trusted_execution: true
    # 카드 #1231 위임 구조 8판 시범: 담당 대화 압축 상한 25만, MCP 도구 스키마를 처음부터 싣는다.
    env:
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "250000"
      ENABLE_TOOL_SEARCH: "false"
  - id: claude-fable
    label: Claude - Fable 5.1
    backend: claude
    model: "claude-fable-5-1[1m]"
    usage_model_id: fable
    supported_efforts: [low, medium, high, xhigh, max]
    default_effort: high
    trusted_execution: true
  - id: claude-fable-5.2
    label: Claude - Fable 5.2
    backend: claude
    model: "claude-fable-5-2[1m]"
    usage_model_id: fable
    supported_efforts: [low, medium, high, xhigh, max]
    default_effort: medium
    trusted_execution: true
  - id: codex-6-astra
    label: Codex - 6 Astra
    backend: codex
    model: gpt-6-astra
    supported_efforts: [low, medium, high, xhigh, max, ultra]
    default_effort: medium
    trusted_execution: true
  - id: codex-6.1-sol
    label: Codex - 6.1 Sol
    backend: codex
    model: gpt-6.1-sol
    supported_efforts: [low, medium, high, xhigh, max, ultra]
    default_effort: high
    trusted_execution: true
  - id: codex-6.1-terra
    label: Codex - 6.1 Terra
    backend: codex
    model: gpt-6.1-terra
    supported_efforts: [low, medium, high, xhigh, max, ultra]
    default_effort: max
  - id: codex-6-sol
    label: Codex - 6 Sol
    backend: codex
    model: gpt-6-sol
    supported_efforts: [low, medium, high, xhigh, max, ultra]
    default_effort: xhigh
    trusted_execution: true
  - id: codex-6-luna
    label: Codex - 6 Luna
    backend: codex
    model: gpt-6-luna
    supported_efforts: [low, medium, high, xhigh, max]
    default_effort: xhigh
  - id: codex-5.6-sol
    label: Codex - 5.6 Sol
    backend: codex
    model: gpt-5.6-sol
    supported_efforts: [low, medium, high, xhigh, max, ultra]
    default_effort: xhigh
  - id: codex-5.6-luna
    label: Codex - 5.6 Luna
    backend: codex
    model: gpt-5.6-luna
    supported_efforts: [low, medium, high, xhigh, max]
    default_effort: xhigh
  - id: codex-5.6-terra
    label: Codex - 5.6 Terra
    backend: codex
    model: gpt-5.6-terra
    supported_efforts: [low, medium, high, xhigh, max, ultra]
    default_effort: xhigh
  - id: kimi-2
    label: Kimi - 2
    backend: claude
    group: china
    provider: kimi
    # 실측(260728): "kimi-for-coding"의 display_name은 "K2.7 Coding".
    # 같은 계열의 "kimi-for-coding-highspeed"는 목록에 노출하지 않는다.
    model: kimi-for-coding
    env:
      ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
      ANTHROPIC_API_KEY: "${KIMI_API_KEY}"
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "262144"
  - id: kimi-3
    label: Kimi - 3
    backend: claude
    group: china
    provider: kimi
    # 실측(260728, GET https://api.kimi.com/coding/v1/models): K3 = "k3".
    # 같은 엔드포인트의 "k3-256k"는 context_length가 262144로 동일하고
    # 비디오 입력만 빠진 부분집합이라 "k3"를 정본으로 둔다.
    model: k3
    env:
      ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
      ANTHROPIC_API_KEY: "${KIMI_API_KEY}"
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "262144"
  - id: kimi-3.1-pro
    label: Kimi - 3.1 Pro
    backend: claude
    group: china
    provider: kimi
    # 실측(261024, GET https://api.kimi.com/coding/v1/models): K3.1 Pro = "k3.1-pro".
    # 같은 계열의 "k3.1-pro-highspeed"는 목록에 노출하지 않는다.
    model: k3.1-pro
    env:
      ANTHROPIC_BASE_URL: https://api.kimi.com/coding/
      ANTHROPIC_API_KEY: "${KIMI_API_KEY}"
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "262144"
  - id: deepseek-flash-4.1
    label: DeepSeek - Flash 4.1
    backend: claude
    group: china
    provider: deepseek
    usage_provider: opencode_go
    # 261106 카드 #1061: OpenCode Go 구독. Go의 deepseek-v4.1-flash는 OpenCode 공지로 1017판.
    # Go 콘솔 Settings > Privacy > Regions에서 Global을 켜야 호출된다.
    model: deepseek-v4.1-flash
    # 261110 카드 #1149: low는 첫 호출이 400(cache_control 거부)으로 즉사. 디렉터 지시로 xhigh, max만 연다.
    supported_efforts: [xhigh, max]
    default_effort: max
    env:
      ANTHROPIC_BASE_URL: https://opencode.ai/inference/go/anthropic
      ANTHROPIC_API_KEY: "${OPENCODE_GO_API_KEY}"
      ENABLE_TOOL_SEARCH: "true"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4.1-flash
      ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4.1-flash
      ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4.1-flash
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "262144"
  - id: gemini-3.8-flash
    label: Gemini - 3.8 Flash
    backend: antigravity
    model: gemini-3.8-flash
    supported_efforts: [low, medium, high]
    default_effort: low
  - id: gemini-4-argon
    label: Gemini - 4 Argon
    backend: antigravity
    model: gemini-4-argon
    supported_efforts: [low, medium, high]
    default_effort: high
    trusted_execution: true
  - id: gemini-4-carbon
    label: Gemini - 4 Carbon
    backend: antigravity
    model: gemini-4-carbon
    supported_efforts: [low, medium, high]
    default_effort: high
    trusted_execution: true
  - id: gemini-4-hydrogen
    label: Gemini - 4 Hydrogen
    backend: antigravity
    model: gemini-4-hydrogen
    supported_efforts: [low, medium, high, xhigh]
    default_effort: high
    trusted_execution: true
  - id: opencode-deepseek-v4.1-flash-free
    label: OpenCode - DeepSeek V4.1 Flash Free
    backend: opencode
    group: china
    provider: deepseek
    model: opencode/deepseek-v4.1-flash-free
    mcp_tool_allowlist:
      roselin:
        soulstream:
          - get_session_name
          - set_session_name
          - search_skills
          - get_markdown_document
          - list_worktrees
          - update_markdown_document
          - create_worktree
          - search_folder_items
          - list_session_events
          - create_markdown_document
          - get_session_event
          - send_message_to_session
          - get_session_highlight
          - search_session_history
          - list_sessions
          - remove_worktree
          - get_folder
          - get_card
          - search_sessions
          - reflect_service
          - get_session_story
          - get_session_summary
          - set_card_items
          - add_card_note
          - browse_folder
          - update_card_now
          - report_card_item
          - request_card_review
          - start_card_work
          - create_agent_session
          - list_node_model_presets
          - delete_worktree_branch
          - update_card_brief
          - get_session_turn_summaries
          - list_nodes
          - list_local_agents
          - create_remote_agent_session
          - add_card_comment
          - list_node_agents
          - list_cards
          - set_card_status
          - list_mcp_registry
          - ask_card_question
          - get_page_markdown
          - list_mcp_profiles
          - get_agents_config
          - add_card_item
          - create_card
          - reflect_brief
          - get_page
          - list_folders
          - list_persistent_session_history
          - transfer_card_assignee
          - list_turn_usage
          - reflect_cluster_brief
        serendipity: []

# Priced model rows. `model` is the canonical id; `aliases` are exact runtime
# strings that price to the same row. Rows without a known price keep
# `rates: null` and exist only for provider and display-name lookup.
models:
  - provider: claude
    model: claude-opus-5-5
    aliases: [claude-opus-5.5]
    display_name: Claude Opus 5.5
    rates: {input: 4, cache_read: 0.2, cache_write_5m: 5, cache_write_1h: 8, output: 20}
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: claude
    model: claude-fable-5-2
    rates: {input: 8, cache_read: 0.2, cache_write_5m: 10, cache_write_1h: 16, output: 40}
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: claude
    model: claude-fable-5-1
    rates: {input: 10, cache_read: 0.25, cache_write_5m: 12.5, cache_write_1h: 20, output: 50}
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: claude
    model: claude-opus-5
    rates: {input: 5, cache_read: 0.5, cache_write_5m: 6.25, cache_write_1h: 10, output: 25}
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: claude
    model: claude-sonnet-5-5
    aliases: [claude-sonnet-5.5]
    display_name: Claude Sonnet 5.5
    rates: {input: 2, cache_read: 0.1, cache_write_5m: 2.5, cache_write_1h: 4, output: 10}
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: claude
    model: claude-sonnet-5
    rates: {input: 2, cache_read: 0.2, cache_write_5m: 2.5, cache_write_1h: 4, output: 10}
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: claude
    model: claude-opus-4-8
    rates: {input: 5, cache_read: 0.5, cache_write_5m: 6.25, cache_write_1h: 10, output: 25}
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: claude
    model: claude-haiku-4-5
    rates: {input: 1, cache_read: 0.1, cache_write_5m: 1.25, cache_write_1h: 2, output: 5}
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: codex
    model: gpt-6-luna
    display_name: GPT-6 Luna
    rates: {input: 0.1, cache_read: 0.01, cache_write_5m: 0.125, cache_write_1h: 0.125, output: 0.5}
    source: https://developers.openai.com/api/docs/pricing?tab=suite
  - provider: codex
    model: gpt-6-sol
    rates: {input: 2, cache_read: 0.2, cache_write_5m: 2.5, cache_write_1h: 2.5, output: 10}
    source: https://developers.openai.com/api/docs/pricing?tab=suite
  - provider: codex
    model: gpt-6.1-sol
    display_name: GPT-6.1 Sol
    rates: {input: 2, cache_read: 0.1, cache_write_5m: 2.5, cache_write_1h: 2.5, output: 10}
    source: https://developers.openai.com/api/docs/pricing?tab=suite
  - provider: codex
    model: gpt-6-astra
    rates: {input: 10, cache_read: 1, cache_write_5m: 12.5, cache_write_1h: 12.5, output: 50}
    source: https://developers.openai.com/api/docs/pricing?tab=suite
  - provider: antigravity
    model: gemini-4-carbon
    display_name: Gemini 4 Carbon
    rates: {input: 2, cache_read: 0.1, cache_write_5m: null, cache_write_1h: null, output: 10}
    source: https://ai.google.dev/gemini-api/docs/pricing
  - provider: antigravity
    model: gemini-4-hydrogen
    display_name: Gemini 4 Hydrogen
    rates: {input: 1.5, cache_read: 0.075, cache_write_5m: null, cache_write_1h: null, output: 7.5}
    source: https://ai.google.dev/gemini-api/docs/pricing
  - provider: antigravity
    model: gemini-4-argon
    display_name: Gemini 4 Argon
    rates: {input: 2, cache_read: 0.1, cache_write_5m: null, cache_write_1h: null, output: 10}
    source: https://ai.google.dev/gemini-api/docs/pricing
  - provider: antigravity
    model: gemini-3.8-flash
    display_name: Gemini 3.8 Flash
    rates: {input: 0.75, cache_read: 0.075, cache_write_5m: null, cache_write_1h: null, output: 3.75}
    source: https://ai.google.dev/gemini-api/docs/pricing
  - provider: deepseek
    model: deepseek-flash
    aliases:
      - deepseek-v4.1-flash-1017
      - deepseek-v4.1-flash
      - deepseek-v4-flash
      - deepseek-v4-flash-vision-exp
      - opencode/deepseek-v4.1-flash-free
    rates: {input: 0.3, cache_read: 0.006, cache_write_5m: null, cache_write_1h: null, output: 1.2}
