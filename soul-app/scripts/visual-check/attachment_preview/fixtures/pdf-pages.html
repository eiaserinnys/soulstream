<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>회의록.pdf</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #eceef1; color: #18191c; font-family: -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif; }
  .page { width: min(100%, 720px); margin: 16px auto; padding: 48px 40px; box-sizing: border-box; min-height: 520px; background: #ffffff; box-shadow: 0 1px 2px rgba(16, 18, 24, .18); }
  .page h1 { margin: 0 0 12px; font-size: 20px; }
  .page p { margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: #3a3d44; }
  .tag { display: inline-block; margin-bottom: 12px; padding: 2px 8px; border: 1px solid #d7dae0; border-radius: 999px; font-size: 11px; color: #6b6f78; }
</style></head>
<body>
<main id="pdf-facsimile">
  <section class="page"><span class="tag">1쪽</span><h1>회의록</h1>
    <p>PDF 문서를 앱 안의 미리보기 창에서 위아래로 이어 봅니다.</p>
    <p>쪽 사이 여백과 문서 바탕이 창의 밝은 바탕 위에 그대로 보이는지 확인합니다.</p>
    <p>이 파일은 헤드리스 브라우저가 PDF 플러그인을 그리지 못해 같은 배치의 HTML로 대신한 것입니다.</p>
  </section>
  <section class="page"><span class="tag">2쪽</span><h1>결정 사항</h1>
    <p>새 전체 화면 보기를 만들지 않고 지금 문서 배치 안에서 PDF를 연다.</p>
    <p>안드로이드는 지금처럼 아이콘과 저장만 둔다.</p>
  </section>
  <section class="page"><span class="tag">3쪽</span><h1>다음 단계</h1>
    <p>iOS 실기기에서 WKWebView가 쪽을 이어 그리는지 확인한다.</p>
  </section>
</main>
</body></html>
