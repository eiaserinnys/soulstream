name: Test Windows Installer

env:
  PNPM_VERSION: '10.32.1'

on:
  push:
    branches: [main]
    paths:
      - 'install/**'
      - 'packages/db-schema/**'
      - 'soul-server-ts/scripts/**'
      - 'soul-server-ts/tests/scripts/**'
      - 'soul-server-ts/src/atomic_file_rename.ts'
      - 'soul-server-ts/src/runner/runner_lifecycle_summary_writer.ts'
      - 'soul-server-ts/src/runner/runner_lifecycle_reader.ts'
      - 'soul-server-ts/src/runner/runner_registration_identity.ts'
      - 'soul-server-ts/src/runner/runner_intervention_resolution.ts'
      - 'soul-server-ts/src/runner/runner_outbox_inspector.ts'
      - 'soul-server-ts/src/runner/runner_sqlite_connection.ts'
      - 'soul-server-ts/src/runner/sqlite_event_outbox.ts'
      - 'soul-server-ts/src/runner/sqlite_intervention_inbox.ts'
      - 'soul-server-ts/src/runner/sqlite_ipc_journal.ts'
      - 'soul-server-ts/src/runner/sqlite_runner_lifecycle.ts'
      - 'soul-server-ts/tests/atomic_file_rename*.test.ts'
      - 'soul-server-ts/tests/runner_sqlite_busy_contention.test.ts'
      - 'orch-server-ts/scripts/**'
      - 'orch-server-ts/tests/**'
      - 'deploy/release-manifest*.json'
      - 'deploy/database-release-*.json'
      - 'deploy/tests/**'
      - '.github/workflows/test-install.yml'
  pull_request:
    paths:
      - 'install/**'
      - 'packages/db-schema/**'
      - 'soul-server-ts/scripts/**'
      - 'soul-server-ts/tests/scripts/**'
      - 'soul-server-ts/src/atomic_file_rename.ts'
      - 'soul-server-ts/src/runner/runner_lifecycle_summary_writer.ts'
      - 'soul-server-ts/src/runner/runner_lifecycle_reader.ts'
      - 'soul-server-ts/src/runner/runner_registration_identity.ts'
      - 'soul-server-ts/src/runner/runner_intervention_resolution.ts'
      - 'soul-server-ts/src/runner/runner_outbox_inspector.ts'
      - 'soul-server-ts/src/runner/runner_sqlite_connection.ts'
      - 'soul-server-ts/src/runner/sqlite_event_outbox.ts'
      - 'soul-server-ts/src/runner/sqlite_intervention_inbox.ts'
      - 'soul-server-ts/src/runner/sqlite_ipc_journal.ts'
      - 'soul-server-ts/src/runner/sqlite_runner_lifecycle.ts'
      - 'soul-server-ts/tests/atomic_file_rename*.test.ts'
      - 'soul-server-ts/tests/runner_sqlite_busy_contention.test.ts'
      - 'orch-server-ts/scripts/**'
      - 'orch-server-ts/tests/**'
      - 'deploy/release-manifest*.json'
      - 'deploy/database-release-*.json'
      - 'deploy/tests/**'
      - '.github/workflows/test-install.yml'
  workflow_dispatch:

jobs:
  database-release-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install repository dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false

      - name: Install pinned Haniel release contract
        shell: bash
        run: >-
          python -m pip install --force-reinstall
          git+https://github.com/eiaserinnys/Haniel.git@3d02d57eb4a78b2eca18acb69c9f099424537c6e

      - name: Run cross-platform database release contracts
        shell: bash
        run: |
          corepack pnpm --dir soul-server-ts exec vitest run \
            tests/scripts/release_executor_concurrency_review.test.ts \
            tests/scripts/release_executor_cli_review.test.ts \
            tests/scripts/release_executor_review.test.ts \
            tests/scripts/migration_contract.test.ts \
            tests/scripts/release_executor_ci_contract.test.ts \
            --maxWorkers=2 --minWorkers=1
          python -m unittest discover \
            -s deploy/tests \
            -p "test_haniel_release_contract.py" \
            -v

      - name: Run real Windows file and SQLite contention contracts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          corepack pnpm --dir soul-server-ts exec vitest run \
            tests/atomic_file_rename.test.ts \
            tests/atomic_file_rename_win32.test.ts \
            tests/runner_sqlite_busy_contention.test.ts \
            --maxWorkers=2 --minWorkers=1

  database-release-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: release_executor_test
          POSTGRES_PASSWORD: release_executor_secret
          POSTGRES_DB: release_executor_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_executor_test -d release_executor_test_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: >-
        postgresql://release_executor_test:release_executor_secret@127.0.0.1:5432/release_executor_test_db
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install repository dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false

      - name: Run isolated PostgreSQL database release contracts
        shell: bash
        run: |
          corepack pnpm --dir soul-server-ts exec vitest run \
            tests/scripts/release_executor.test.ts \
            tests/scripts/migration_runner.test.ts \
            tests/scripts/apply_schema.test.ts \
            tests/scripts/release_executor_postgres_review.test.ts \
            --maxWorkers=2 --minWorkers=1 \
            --reporter=default --reporter=json \
            --outputFile.json=database-release-postgres-results.json
          node packages/db-schema/scripts/verify-vitest-contract-result.mjs \
            soul-server-ts/database-release-postgres-results.json 30

  test-install:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PGUSER: soulstream_schema_test
      PGPASSWORD: soulstream_schema_secret
      PGDATABASE: release_executor_test_db
      PGPORT: '54329'
      SOULSTREAM_SOURCE_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      SOULSTREAM_SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Guard page projection SQL
        shell: pwsh
        run: |
          python packages/db-schema/scripts/check_projection_dml.py
          python -m unittest discover `
            -s packages/db-schema/tests `
            -p "test_projection_dml_guard.py" `
            -v

      - name: Install paired Haniel release contract
        shell: pwsh
        run: |
          python -m pip install --force-reinstall `
            git+https://github.com/eiaserinnys/Haniel.git@3d02d57eb4a78b2eca18acb69c9f099424537c6e

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install repository dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false

      - name: Expose PostgreSQL 16+ client tools
        shell: pwsh
        run: |
          $candidate = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory -ErrorAction SilentlyContinue |
            Where-Object { [int]$_.Name -ge 16 } |
            Sort-Object { [int]$_.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $candidate) {
            choco install postgresql16 --yes --no-progress
            $candidate = Get-Item "C:\Program Files\PostgreSQL\16"
          }
          $bin = Join-Path $candidate.FullName "bin"
          if (-not (Test-Path (Join-Path $bin "pg_dump.exe")) -or
              -not (Test-Path (Join-Path $bin "pg_restore.exe"))) {
            throw "PostgreSQL client tools were not installed at $bin"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "soulstream-test-pg"
          $passwordFile = Join-Path $env:RUNNER_TEMP "soulstream-test-pg-password"
          $logFile = Join-Path $env:RUNNER_TEMP "soulstream-test-pg.log"
          $env:PGDATA = $dataDir
          $env:PGHOST = "127.0.0.1"
          $env:PGPASSWORD | Set-Content -Path $passwordFile -NoNewline -Encoding utf8
          initdb -D $dataDir -U $env:PGUSER --pwfile=$passwordFile `
            --auth-host=scram-sha-256 --encoding=UTF8
          Remove-Item $passwordFile -Force
          pg_ctl -D $dataDir -l $logFile -o "-p $env:PGPORT -h 127.0.0.1" start

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            pg_isready -h 127.0.0.1 -p $env:PGPORT -U $env:PGUSER -d postgres
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Write-Error "PostgreSQL did not become ready"
            exit 1
          }
          createdb -h 127.0.0.1 -p $env:PGPORT -U $env:PGUSER $env:PGDATABASE

      - name: Run actual database release PostgreSQL contracts
        shell: pwsh
        run: |
          $env:TEST_DATABASE_URL = "postgresql://{0}:{1}@127.0.0.1:{2}/{3}" -f `
            $env:PGUSER, $env:PGPASSWORD, $env:PGPORT, $env:PGDATABASE
          $resultPath = "database-release-postgres-results.json"
          corepack pnpm --dir soul-server-ts exec vitest run `
            tests/scripts/release_executor.test.ts `
            tests/scripts/migration_runner.test.ts `
            tests/scripts/apply_schema.test.ts `
            --maxWorkers=2 --minWorkers=1 `
            --reporter=default --reporter=json --outputFile.json=$resultPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/db-schema/scripts/verify-vitest-contract-result.mjs `
            (Join-Path "soul-server-ts" $resultPath) 26

      - name: Verify release activation contract stub
        shell: pwsh
        run: node --test soul-server-ts/scripts/test_install_release_activation_orch.test.mjs

      - name: Start release activation contract stub
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "release-activation-orch.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "release-activation-orch.stderr.log"
          $runnerTrackingId = $env:RUNNER_TRACKING_ID
          try {
            $env:RUNNER_TRACKING_ID = ""
            $process = Start-Process `
              -FilePath "node" `
              -ArgumentList @(
                "soul-server-ts/scripts/test_install_release_activation_orch.mjs",
                "--host", "127.0.0.1",
                "--port", "5200"
              ) `
              -PassThru `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr
          } finally {
            $env:RUNNER_TRACKING_ID = $runnerTrackingId
          }
          "TEST_INSTALL_ACTIVATION_STUB_PID=$($process.Id)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $ready = $false
          for ($attempt = 1; $attempt -le 15; $attempt++) {
            if ($process.HasExited) {
              Get-Content $stdout -ErrorAction Continue
              Get-Content $stderr -ErrorAction Continue
              Write-Error "Release activation contract stub exited before listening"
              exit 1
            }
            if (Test-NetConnection 127.0.0.1 -Port 5200 -InformationLevel Quiet) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            Write-Error "Release activation contract stub did not listen on port 5200"
            exit 1
          }

      - name: Run installer (non-interactive)
        shell: pwsh
        run: |
          $stubProcess = Get-Process `
            -Id ([int]$env:TEST_INSTALL_ACTIVATION_STUB_PID) `
            -ErrorAction SilentlyContinue
          if ($null -eq $stubProcess -or
              -not (Test-NetConnection 127.0.0.1 -Port 5200 -InformationLevel Quiet)) {
            Write-Error "Release activation contract stub did not survive the step boundary"
            exit 1
          }

          $dbUrl = "postgresql://{0}:{1}@127.0.0.1:{2}/{3}" -f $env:PGUSER, $env:PGPASSWORD, $env:PGPORT, $env:PGDATABASE
          .\install\install.ps1 `
            -NonInteractive `
            -Force `
            -InstallDir "C:\soulstream-test" `
            -WorkspaceDir "C:\workspace-test" `
            -Port 3105 `
            -DatabaseUrl $dbUrl `
            -AuthBearerToken "ci-test-token" `
            -RepositoryUrl $env:SOULSTREAM_SOURCE_URL `
            -RepositoryBranch $env:SOULSTREAM_SOURCE_BRANCH

      - name: Verify actual release manifest recovery contract
        shell: pwsh
        run: |
          python -m unittest discover `
            -s deploy/tests `
            -p "test_haniel_release_contract.py" `
            -v

      - name: Verify service health
        shell: pwsh
        run: |
          $maxRetry = 10
          $attempt = 0
          $ok = $false
          while ($attempt -lt $maxRetry) {
            try {
              $res = Invoke-RestMethod "http://localhost:3105/health" -TimeoutSec 3
              Write-Host "Health check OK: $($res | ConvertTo-Json -Compress)"
              if ($res.service -ne "soul-server-ts") {
                Write-Error "Unexpected service: $($res.service)"
                exit 1
              }
              $ok = $true
              break
            } catch {
              Write-Host "Attempt $($attempt+1)/$maxRetry failed: $_"
              Start-Sleep -Seconds 3
              $attempt++
            }
          }
          if (-not $ok) {
            Write-Error "Service did not respond after $maxRetry attempts"
            exit 1
          }

      - name: Smoke test — PostgreSQL schema
        shell: pwsh
        run: |
          $sessionsTable = psql `
            -h 127.0.0.1 `
            -p $env:PGPORT `
            -U $env:PGUSER `
            -d $env:PGDATABASE `
            -tAc "SELECT to_regclass('public.sessions')"
          if ($sessionsTable.Trim() -ne "sessions") {
            Write-Error "sessions table was not created"
            exit 1
          }

          $sessionGet = psql `
            -h 127.0.0.1 `
            -p $env:PGPORT `
            -U $env:PGUSER `
            -d $env:PGDATABASE `
            -tAc "SELECT to_regprocedure('public.session_get(text)')"
          if ($sessionGet.Trim() -ne "session_get(text)") {
            Write-Error "session_get(text) procedure was not created"
            exit 1
          }
          Write-Host "PostgreSQL schema smoke test passed"

      - name: Dump service logs on failure
        if: failure()
        shell: pwsh
        run: |
          $logDir = "C:\soulstream-test\logs"
          Write-Host "=== Log inventory: $logDir ==="
          if (Test-Path $logDir) {
            $logFiles = Get-ChildItem -LiteralPath $logDir -File -Recurse |
              Sort-Object FullName
            $logFiles |
              Select-Object FullName, Length, LastWriteTimeUtc |
              Format-Table -AutoSize
            foreach ($logFile in $logFiles) {
              Write-Host "=== $($logFile.FullName) (last 400 lines) ==="
              Get-Content -LiteralPath $logFile.FullName -Tail 400 -ErrorAction Continue
            }
          } else {
            Write-Host "(log directory not found)"
          }

          $serviceLog = Join-Path $logDir "soul-server-ts.log"
          if (-not (Test-Path $serviceLog)) {
            Write-Host "soul-server-ts.log was not captured"
          }
          Write-Host "=== Processes ==="
          Get-Process | Where-Object { $_.ProcessName -match "node|haniel" } | Format-Table Name, Id, CPU

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-service-logs
          path: C:\soulstream-test\logs\
          if-no-files-found: warn
          retention-days: 7

      - name: Dump release activation contract stub logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content `
            (Join-Path $env:RUNNER_TEMP "release-activation-orch.stdout.log") `
            -ErrorAction Continue
          Get-Content `
            (Join-Path $env:RUNNER_TEMP "release-activation-orch.stderr.log") `
            -ErrorAction Continue

      - name: Print service info
        shell: pwsh
        run: |
          Write-Host "=== Installation Summary ==="
          Write-Host "Install dir : C:\soulstream-test"
          Write-Host "Workspace   : C:\workspace-test"
          Write-Host "Port        : 3105"
          try {
            $info = Invoke-RestMethod "http://localhost:3105/health"
            Write-Host "Service     : UP"
          } catch {
            Write-Host "Service     : DOWN (health check failed)"
          }
          Write-Host "Dashboard   : C:\soulstream-test\soulstream\unified-dashboard\dist"
          if (Test-Path "C:\soulstream-test\soulstream\unified-dashboard\dist\index.html") {
            Write-Host "Dashboard build: OK"
          } else {
            Write-Host "Dashboard build: MISSING"
          }

      - name: Stop PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "soulstream-test-pg"
          if (Test-Path $dataDir) {
            pg_ctl -D $dataDir stop -m fast
          }

      - name: Stop release activation contract stub
        if: always()
        shell: pwsh
        run: |
          if ($env:TEST_INSTALL_ACTIVATION_STUB_PID) {
            Stop-Process `
              -Id ([int]$env:TEST_INSTALL_ACTIVATION_STUB_PID) `
              -Force `
              -ErrorAction SilentlyContinue
          }
