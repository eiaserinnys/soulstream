name: Test Windows Installer

env:
  PNPM_VERSION: '10.32.1'

on:
  push:
    branches: [main]
    paths:
      - 'install/**'
      - 'README.md'
      - 'docs/guide/installation.md'
      - 'packages/db-schema/**'
      - 'soul-server-ts/scripts/**'
      - 'soul-server-ts/tests/scripts/**'
      - 'packages/atomic-file-rename/**'
      - 'packages/executable-path/**'
      - 'soul-server-ts/src/runner/runner_lifecycle_summary_writer.ts'
      - 'soul-server-ts/src/runner/runner_lifecycle_reader.ts'
      - 'soul-server-ts/src/runner/runner_registration_identity.ts'
      - 'soul-server-ts/src/runner/runner_outbox_inspector.ts'
      - 'soul-server-ts/src/runner/runner_sqlite_connection.ts'
      - 'soul-server-ts/src/runner/sqlite_event_outbox.ts'
      - 'soul-server-ts/src/runner/sqlite_intervention_inbox_migration.ts'
      - 'soul-server-ts/src/runner/sqlite_intervention_receipt.ts'
      - 'soul-server-ts/src/runner/sqlite_ipc_journal.ts'
      - 'soul-server-ts/src/runner/sqlite_runner_lifecycle.ts'
      - 'soul-server-ts/tests/atomic_file_rename*.test.ts'
      - 'soul-server-ts/tests/runner_sqlite_busy_contention.test.ts'
      - 'orch-server-ts/scripts/**'
      - 'orch-server-ts/tests/**'
      - 'deploy/release-manifest*.json'
      - 'deploy/database-release-*.json'
      - 'deploy/tests/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-install.yml'
  pull_request:
    paths:
      - 'install/**'
      - 'README.md'
      - 'docs/guide/installation.md'
      - 'packages/db-schema/**'
      - 'soul-server-ts/scripts/**'
      - 'soul-server-ts/tests/scripts/**'
      - 'packages/atomic-file-rename/**'
      - 'packages/executable-path/**'
      - 'soul-server-ts/src/runner/runner_lifecycle_summary_writer.ts'
      - 'soul-server-ts/src/runner/runner_lifecycle_reader.ts'
      - 'soul-server-ts/src/runner/runner_registration_identity.ts'
      - 'soul-server-ts/src/runner/runner_outbox_inspector.ts'
      - 'soul-server-ts/src/runner/runner_sqlite_connection.ts'
      - 'soul-server-ts/src/runner/sqlite_event_outbox.ts'
      - 'soul-server-ts/src/runner/sqlite_intervention_inbox_migration.ts'
      - 'soul-server-ts/src/runner/sqlite_intervention_receipt.ts'
      - 'soul-server-ts/src/runner/sqlite_ipc_journal.ts'
      - 'soul-server-ts/src/runner/sqlite_runner_lifecycle.ts'
      - 'soul-server-ts/tests/atomic_file_rename*.test.ts'
      - 'soul-server-ts/tests/runner_sqlite_busy_contention.test.ts'
      - 'orch-server-ts/scripts/**'
      - 'orch-server-ts/tests/**'
      - 'deploy/release-manifest*.json'
      - 'deploy/database-release-*.json'
      - 'deploy/tests/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/test-install.yml'
  workflow_dispatch:

jobs:
  database-release-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install repository dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Install pinned Haniel release contract
        shell: bash
        run: >-
          python -m pip install --force-reinstall
          git+https://github.com/eiaserinnys/Haniel.git@d143f0d8f7afffa4656f4ed10349a376cef585a1

      - name: Run cross-platform database release contracts
        shell: bash
        run: |
          corepack pnpm --dir soul-server-ts exec vitest run \
            tests/scripts/release_executor_installer.test.ts \
            tests/scripts/release_executor_concurrency_review.test.ts \
            tests/scripts/release_executor_cli_review.test.ts \
            tests/scripts/release_executor_review.test.ts \
            tests/scripts/migration_contract.test.ts \
            tests/scripts/release_executor_ci_contract.test.ts \
            --maxWorkers=2 --minWorkers=1
          python -m unittest discover \
            -s deploy/tests \
            -p "test_*.py" \
            -v

      - name: Run real Windows file and SQLite contention contracts
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          corepack pnpm --dir soul-server-ts exec vitest run \
            tests/atomic_file_rename.test.ts \
            tests/atomic_file_rename_win32.test.ts \
            tests/runner_sqlite_busy_contention.test.ts \
            --maxWorkers=2 --minWorkers=1

  database-release-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: release_executor_test
          POSTGRES_PASSWORD: release_executor_secret
          POSTGRES_DB: release_executor_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release_executor_test -d release_executor_test_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: >-
        postgresql://release_executor_test:release_executor_secret@127.0.0.1:5432/release_executor_test_db
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install repository dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Run isolated PostgreSQL database release contracts
        shell: bash
        run: |
          corepack pnpm --dir soul-server-ts exec vitest run \
            tests/scripts/release_executor.postgres.test.ts \
            tests/scripts/migration_runner.postgres.test.ts \
            tests/scripts/apply_schema.postgres.test.ts \
            tests/scripts/release_executor_postgres_review.postgres.test.ts \
            --maxWorkers=2 --minWorkers=1 \
            --reporter=default --reporter=json \
            --outputFile.json=database-release-postgres-results.json
          node packages/db-schema/scripts/verify-vitest-contract-result.mjs \
            soul-server-ts/database-release-postgres-results.json 30

  linux-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: installer_schema_test
          POSTGRES_PASSWORD: installer_schema_secret
          POSTGRES_DB: installer_schema_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U installer_schema_test -d installer_schema_test_db"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: >-
        postgresql://installer_schema_test:installer_schema_secret@127.0.0.1:5432/installer_schema_test_db
      PG_BIN_DIR: /usr/lib/postgresql/16/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install repository dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Install PostgreSQL 16 client tools
        shell: bash
        run: |
          sudo apt-get update
          if ! apt-cache show postgresql-client-16 >/dev/null 2>&1; then
            sudo apt-get install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          fi
          sudo apt-get install -y postgresql-client-16
          "$PG_BIN_DIR/pg_dump" --version

      - name: Check installer syntax
        run: bash -n install/install.sh

      - name: Check uninstaller syntax
        run: bash -n install/uninstall.sh

      - name: Run installer tests
        run: node --test install/tests/*.test.mjs

      - name: Run the installer schema step against PostgreSQL
        run: node --test install/tests/integration/install_schema_upgrade.postgres.test.mjs

  test-install:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PGUSER: soulstream_schema_test
      PGPASSWORD: soulstream_schema_secret
      PGDATABASE: release_executor_test_db
      PGPORT: '54329'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pin installer source
        shell: pwsh
        run: |
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not identify checkout commit" }
          $repository = (Join-Path $env:RUNNER_TEMP "soulstream-pinned.git").Replace('\', '/')
          git init --bare $repository
          if ($LASTEXITCODE -ne 0) { throw "Could not initialize pinned repository" }
          git push $repository "${commit}:refs/heads/ci-pinned"
          if ($LASTEXITCODE -ne 0) { throw "Could not push pinned commit" }
          "SOULSTREAM_SOURCE_URL=$repository" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOULSTREAM_SOURCE_BRANCH=ci-pinned" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SOULSTREAM_PINNED_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Pinned commit: $commit"

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Guard page projection SQL
        shell: pwsh
        run: |
          python packages/db-schema/scripts/check_projection_dml.py
          python -m unittest discover `
            -s packages/db-schema/tests `
            -p "test_projection_dml_guard.py" `
            -v

      - name: Install paired Haniel release contract
        shell: pwsh
        run: |
          python -m pip install --force-reinstall `
            git+https://github.com/eiaserinnys/Haniel.git@d143f0d8f7afffa4656f4ed10349a376cef585a1

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install repository dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Expose PostgreSQL 16+ client tools
        shell: pwsh
        run: |
          $candidate = Get-ChildItem "C:\Program Files\PostgreSQL" -Directory -ErrorAction SilentlyContinue |
            Where-Object { [int]$_.Name -ge 16 } |
            Sort-Object { [int]$_.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $candidate) {
            choco install postgresql16 --yes --no-progress
            $candidate = Get-Item "C:\Program Files\PostgreSQL\16"
          }
          $bin = Join-Path $candidate.FullName "bin"
          if (-not (Test-Path (Join-Path $bin "pg_dump.exe")) -or
              -not (Test-Path (Join-Path $bin "pg_restore.exe"))) {
            throw "PostgreSQL client tools were not installed at $bin"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "soulstream-test-pg"
          $passwordFile = Join-Path $env:RUNNER_TEMP "soulstream-test-pg-password"
          $logFile = Join-Path $env:RUNNER_TEMP "soulstream-test-pg.log"
          $env:PGDATA = $dataDir
          $env:PGHOST = "127.0.0.1"
          $env:PGPASSWORD | Set-Content -Path $passwordFile -NoNewline -Encoding utf8
          initdb -D $dataDir -U $env:PGUSER --pwfile=$passwordFile `
            --auth-host=scram-sha-256 --encoding=UTF8
          Remove-Item $passwordFile -Force
          pg_ctl -D $dataDir -l $logFile -o "-p $env:PGPORT -h 127.0.0.1" start

          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            pg_isready -h 127.0.0.1 -p $env:PGPORT -U $env:PGUSER -d postgres
            if ($LASTEXITCODE -eq 0) {
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Write-Error "PostgreSQL did not become ready"
            exit 1
          }
          createdb -h 127.0.0.1 -p $env:PGPORT -U $env:PGUSER $env:PGDATABASE

      - name: Run actual database release PostgreSQL contracts
        shell: pwsh
        run: |
          $env:TEST_DATABASE_URL = "postgresql://{0}:{1}@127.0.0.1:{2}/{3}" -f `
            $env:PGUSER, $env:PGPASSWORD, $env:PGPORT, $env:PGDATABASE
          $resultPath = "database-release-postgres-results.json"
          corepack pnpm --dir soul-server-ts exec vitest run `
            tests/scripts/release_executor.postgres.test.ts `
            tests/scripts/migration_runner.postgres.test.ts `
            tests/scripts/apply_schema.postgres.test.ts `
            --maxWorkers=2 --minWorkers=1 `
            --reporter=default --reporter=json --outputFile.json=$resultPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node packages/db-schema/scripts/verify-vitest-contract-result.mjs `
            (Join-Path "soul-server-ts" $resultPath) 25

      - name: Verify release activation contract stub
        shell: pwsh
        run: node --test soul-server-ts/scripts/test_install_release_activation_orch.test.mjs

      - name: Run installer and verify release activation
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "release-activation-orch.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "release-activation-orch.stderr.log"
          $stubProcess = Start-Process `
            -FilePath "node" `
            -ArgumentList @(
              "soul-server-ts/scripts/test_install_release_activation_orch.mjs",
              "--host", "127.0.0.1",
              "--port", "5200"
            ) `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr

          try {
            $stubReady = $false
            for ($attempt = 1; $attempt -le 15; $attempt++) {
              if ($stubProcess.HasExited) {
                Get-Content $stdout -ErrorAction Continue
                Get-Content $stderr -ErrorAction Continue
                throw "Release activation contract stub exited before listening"
              }
              if (Test-NetConnection 127.0.0.1 -Port 5200 -InformationLevel Quiet) {
                $stubReady = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $stubReady) {
              throw "Release activation contract stub did not listen on port 5200"
            }

            .\install\install.ps1 `
              -NonInteractive `
              -Force `
              -InstallDir "C:\soulstream-test" `
              -WorkspaceDir "C:\workspace-test" `
              -Port 3105 `
              -UpstreamUrl "ws://127.0.0.1:5200/ws/node" `
              -AuthBearerToken "ci-test-token" `
              -RepositoryUrl $env:SOULSTREAM_SOURCE_URL `
              -RepositoryBranch $env:SOULSTREAM_SOURCE_BRANCH

            python -m unittest discover `
              -s deploy/tests `
              -p "test_*.py" `
              -v
            if ($LASTEXITCODE -ne 0) {
              throw "Release manifest recovery contract failed"
            }

            $maxRetry = 10
            $healthReady = $false
            for ($attempt = 1; $attempt -le $maxRetry; $attempt++) {
              try {
                $res = Invoke-RestMethod "http://localhost:3105/health" -TimeoutSec 3
                Write-Host "Health check OK: $($res | ConvertTo-Json -Compress)"
                if ($res.service -ne "soul-server-ts") {
                  throw "Unexpected service: $($res.service)"
                }
                $healthReady = $true
                break
              } catch {
                Write-Host "Attempt $attempt/$maxRetry failed: $_"
                Start-Sleep -Seconds 3
              }
            }
            if (-not $healthReady) {
              throw "Service did not respond after $maxRetry attempts"
            }
          } finally {
            Stop-Process -Id $stubProcess.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Verify installed source commit
        shell: pwsh
        run: |
          $installedCommit = git -C "C:\soulstream-test\soulstream" rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not identify installed source commit" }
          Write-Host "Pinned commit: $env:SOULSTREAM_PINNED_COMMIT"
          Write-Host "Installed HEAD: $installedCommit"
          $logDir = "C:\soulstream-test\logs"
          if (Test-Path $logDir) {
            $startupUpdates = Get-ChildItem -LiteralPath $logDir -File -Recurse |
              Where-Object { $_.Name -match "haniel" } |
              Select-String -Pattern "startup.*update|update.*startup"
            if ($startupUpdates) {
              $startupUpdates | ForEach-Object { Write-Host $_.Line }
            } else {
              Write-Host "Haniel startup update: no matching log lines"
            }
          } else {
            Write-Host "Haniel startup update: log directory not found"
          }
          if ($installedCommit -ne $env:SOULSTREAM_PINNED_COMMIT) {
            throw "Installed source commit does not match pinned commit"
          }

      - name: Dump service logs on failure
        if: failure()
        shell: pwsh
        run: |
          $logDir = "C:\soulstream-test\logs"
          Write-Host "=== Log inventory: $logDir ==="
          if (Test-Path $logDir) {
            $logFiles = Get-ChildItem -LiteralPath $logDir -File -Recurse |
              Sort-Object FullName
            $logFiles |
              Select-Object FullName, Length, LastWriteTimeUtc |
              Format-Table -AutoSize
            foreach ($logFile in $logFiles) {
              Write-Host "=== $($logFile.FullName) (last 400 lines) ==="
              Get-Content -LiteralPath $logFile.FullName -Tail 400 -ErrorAction Continue
            }
          } else {
            Write-Host "(log directory not found)"
          }

          $serviceLog = Join-Path $logDir "soul-server-ts.log"
          if (-not (Test-Path $serviceLog)) {
            Write-Host "soul-server-ts.log was not captured"
          }
          Write-Host "=== Processes ==="
          Get-Process | Where-Object { $_.ProcessName -match "node|haniel" } | Format-Table Name, Id, CPU

      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-installer-service-logs
          path: C:\soulstream-test\logs\
          if-no-files-found: warn
          retention-days: 7

      - name: Dump release activation contract stub logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-Content `
            (Join-Path $env:RUNNER_TEMP "release-activation-orch.stdout.log") `
            -ErrorAction Continue
          Get-Content `
            (Join-Path $env:RUNNER_TEMP "release-activation-orch.stderr.log") `
            -ErrorAction Continue

      - name: Print service info
        shell: pwsh
        run: |
          Write-Host "=== Installation Summary ==="
          Write-Host "Install dir : C:\soulstream-test"
          Write-Host "Workspace   : C:\workspace-test"
          Write-Host "Port        : 3105"
          try {
            $info = Invoke-RestMethod "http://localhost:3105/health"
            Write-Host "Service     : UP"
          } catch {
            Write-Host "Service     : DOWN (health check failed)"
          }
          Write-Host "Control plane: ws://127.0.0.1:5200/ws/node"

      - name: Stop PostgreSQL
        if: always()
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "soulstream-test-pg"
          if (Test-Path $dataDir) {
            pg_ctl -D $dataDir stop -m fast
          }

  windows-full-install:
    runs-on: windows-latest
    timeout-minutes: 75

    env:
      INSTALL_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The folder name is built from code points so no Korean text has to survive the workflow file.
      - name: Choose an install folder with Korean letters and spaces
        shell: pwsh
        run: |
          $name = -join [char[]](0xC18C, 0xC6B8, 0x20, 0xC2A4, 0xD2B8, 0xB9BC, 0x20, 0xC2DC, 0xD5D8)
          $root = Join-Path $env:LOCALAPPDATA $name
          [IO.File]::AppendAllText($env:GITHUB_ENV, "SOULSTREAM_TEST_ROOT=$root`n", [Text.UTF8Encoding]::new($false))
          Write-Host "InstallRoot: $root"

      - name: Refuse a folder the installer did not create (Windows PowerShell 5.1)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Restricted -Force
          $foreign = Join-Path $env:RUNNER_TEMP "not-soulstream"
          New-Item -ItemType Directory -Force -Path $foreign | Out-Null
          Set-Content -LiteralPath (Join-Path $foreign "keep.txt") -Value "keep" -Encoding ASCII
          foreach ($script in @("install-windows.ps1", "uninstall-windows.ps1")) {
            $source = Get-Content -Raw -Encoding UTF8 (Join-Path ".\install" $script)
            $refused = $false
            try { & ([scriptblock]::Create($source)) -NonInteractive -PostgresPassword root -InstallRoot $foreign } catch {
              $refused = $true
              Write-Host "$script refused the folder: $($_.Exception.Message)"
            }
            if (-not $refused) { throw "$script accepted a folder without the installer marker." }
            $left = @(Get-ChildItem -LiteralPath $foreign -Force | ForEach-Object { $_.Name })
            if (($left -join ",") -ne "keep.txt" -or (Get-Content -LiteralPath (Join-Path $foreign "keep.txt")) -ne "keep") {
              throw "$script changed the folder: $($left -join ', ')"
            }
          }
          Write-Host "Marker check: both scripts refused $foreign and left keep.txt alone."

      - name: Put stand-in user logins in the user's home
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $claudeDir = Join-Path $env:USERPROFILE ".claude"
          $codexDir = Join-Path $env:USERPROFILE ".codex"
          New-Item -ItemType Directory -Force -Path $claudeDir, $codexDir | Out-Null
          Set-Content -LiteralPath (Join-Path $claudeDir ".credentials.json") -Encoding ascii -Value '{"claudeAiOauth":{"accessToken":"user-claude-access","refreshToken":"user-claude-refresh","expiresAt":4102444800000}}'
          Set-Content -LiteralPath (Join-Path $codexDir "auth.json") -Encoding ascii -Value '{"tokens":{"access_token":"user-codex-access","refresh_token":"user-codex-refresh","account_id":"user-account"}}'
          $snapshot = [ordered]@{
            claude = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $claudeDir ".credentials.json")).Hash
            codex = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $codexDir "auth.json")).Hash
            claudeEntries = @(Get-ChildItem -LiteralPath $claudeDir -Force | ForEach-Object { $_.Name })
          }
          $snapshot | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP "user-logins.json") -Encoding utf8
          Write-Host "Stand-in logins: .claude\.credentials.json $($snapshot.claude), .codex\auth.json $($snapshot.codex)"

      - name: Install Soulstream (Windows PowerShell 5.1, Restricted policy)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Restricted -Force
          Write-Host "Shell: Windows PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)), execution policy $(Get-ExecutionPolicy)"
          $installer = Get-Content -Raw -Encoding UTF8 .\install\install-windows.ps1
          & ([scriptblock]::Create($installer)) -NonInteractive -Ref $env:INSTALL_REF -PostgresPassword root -InstallRoot $env:SOULSTREAM_TEST_ROOT

      - name: Check the running installation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:SOULSTREAM_TEST_ROOT
          $folder = Get-Item -LiteralPath $root
          Write-Host "Install folder: $($folder.FullName) (name code points: $(($folder.Name.ToCharArray() | ForEach-Object { '{0:X4}' -f [int]$_ }) -join ' '))"
          if (-not (Test-Path -LiteralPath (Join-Path $root ".soulstream-windows-install"))) { throw "The install marker is missing." }
          $soul = Join-Path $root "soulstream"
          $installedCommit = git -C $soul rev-parse HEAD
          if ($installedCommit -ne $env:INSTALL_REF) { throw "Installed $installedCommit, expected $env:INSTALL_REF" }
          foreach ($url in @("http://127.0.0.1:5200/api/health", "http://127.0.0.1:4200/api/health", "http://127.0.0.1:4205/health")) {
            $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
            if ($response.StatusCode -ne 200) { throw "$url answered $($response.StatusCode)" }
            Write-Host "$url OK"
          }
          $password = (Get-Content -LiteralPath (Join-Path $soul ".admin-password") | Select-Object -First 1).Trim()
          $login = @{ password = $password } | ConvertTo-Json -Compress
          $null = Invoke-WebRequest -Uri "http://127.0.0.1:5200/api/auth/password-login" -Method Post -ContentType "application/json" -Body $login -SessionVariable session -UseBasicParsing
          $folders = Invoke-RestMethod -Uri "http://127.0.0.1:5200/api/folders" -WebSession $session
          if (@($folders.folders | Where-Object { $_.name -eq "작업실" }).Count -ne 1) { throw "The workspace folder is missing." }
          $bearer = (Select-String -LiteralPath (Join-Path $soul ".env.orch") -Pattern "^AUTH_BEARER_TOKEN=(.+)$").Matches[0].Groups[1].Value
          $nodes = Invoke-RestMethod -Uri "http://127.0.0.1:5200/api/nodes" -Headers @{ Authorization = "Bearer $bearer" }
          if (@($nodes.nodes | Where-Object { $_.nodeId -eq "local" -and $_.connected }).Count -ne 1) { throw "The local node is not connected." }
          if (-not (Get-ScheduledTask -TaskName "SoulstreamServer" -ErrorAction SilentlyContinue)) { throw "The SoulstreamServer logon task is missing." }
          if (Test-Path (Join-Path $root "runner.pid")) { Write-Host "Haniel start path: direct start (the logon task did not start it)" } else { Write-Host "Haniel start path: logon task" }
          $workerLog = Join-Path $root "logs\worker.log"
          foreach ($line in @("Claude Code executable path resolved", "Codex CLI path resolved")) {
            $found = Select-String -LiteralPath $workerLog -SimpleMatch $line | Select-Object -Last 1
            if (-not $found) { throw "The worker log has no '$line' line." }
            Write-Host $found.Line
          }
          Write-Host "Soulstream is up with the local node connected and both backends found."
          $atomPage = Invoke-WebRequest -Uri "http://127.0.0.1:4200/" -UseBasicParsing -TimeoutSec 10
          if ($atomPage.StatusCode -ne 200 -or "$($atomPage.Headers['Content-Type'])" -notmatch "text/html") {
            throw "The atom dashboard answered $($atomPage.StatusCode) $($atomPage.Headers['Content-Type'])"
          }
          Write-Host "The atom dashboard serves HTML."

      - name: Check that the user's own logins were left alone
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $before = Get-Content -Raw -LiteralPath (Join-Path $env:RUNNER_TEMP "user-logins.json") | ConvertFrom-Json
          $claudeDir = Join-Path $env:USERPROFILE ".claude"
          $claudeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $claudeDir ".credentials.json")).Hash
          $codexHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $env:USERPROFILE ".codex\auth.json")).Hash
          if ($claudeHash -ne $before.claude -or $codexHash -ne $before.codex) { throw "A user login file changed: claude $claudeHash, codex $codexHash" }
          Write-Host "User logins unchanged: .claude\.credentials.json $claudeHash, .codex\auth.json $codexHash"
          $userPool = Join-Path $env:USERPROFILE ".claude-accounts"
          if (Test-Path -LiteralPath $userPool) { throw "$userPool was created." }
          Write-Host "No user account pool: $userPool does not exist."
          $agentPool = Join-Path $env:SOULSTREAM_TEST_ROOT "agent-home\.claude-accounts"
          $accountsFile = Join-Path $agentPool "accounts.json"
          $accounts = if (Test-Path -LiteralPath $accountsFile) { @((Get-Content -Raw -LiteralPath $accountsFile | ConvertFrom-Json)) } else { @() }
          $accountCount = @($accounts | ForEach-Object { if ($_.PSObject.Properties["accounts"]) { $_.accounts } else { $_ } } | Where-Object { $_ }).Count
          $copies = @(Get-ChildItem -LiteralPath $agentPool -Recurse -Force -File -Filter ".credentials.json" -ErrorAction SilentlyContinue)
          if ($accountCount -ne 0 -or $copies.Count -ne 0) { throw "The agent-home pool has $accountCount accounts and $($copies.Count) credential files." }
          Write-Host "Agent-home pool is empty: $accountCount accounts, no credential copies in $agentPool."
          $shared = @("projects", "file-history", "tasks", "plans", "session-env", "agent-memory")
          $added = @(Get-ChildItem -LiteralPath $claudeDir -Force | ForEach-Object { $_.Name } | Where-Object { $_ -notin @($before.claudeEntries) })
          if (@($added | Where-Object { $_ -in $shared }).Count -ne 0) { throw "New folders under $claudeDir`: $($added -join ', ')" }
          Write-Host "No new pool folders under $claudeDir (other new entries: $(if ($added.Count) { $added -join ', ' } else { 'none' }))."

      - name: Dump logs on failure
        if: failure()
        shell: pwsh
        run: |
          $logs = Join-Path $env:SOULSTREAM_TEST_ROOT "logs"
          if (Test-Path $logs) {
            foreach ($file in Get-ChildItem -LiteralPath $logs -File -Recurse) {
              Write-Host "=== $($file.FullName) (last 200 lines) ==="
              Get-Content -LiteralPath $file.FullName -Tail 200 -ErrorAction Continue
            }
          } else {
            Write-Host "(no log folder)"
          }

      - name: Link a folder outside the install folder into the workspace
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $outside = Join-Path $env:RUNNER_TEMP "outside-target"
          New-Item -ItemType Directory -Force -Path $outside | Out-Null
          Set-Content -LiteralPath (Join-Path $outside "keep.txt") -Value "keep" -Encoding ASCII
          $workspace = Join-Path $env:SOULSTREAM_TEST_ROOT "workspace"
          New-Item -ItemType Directory -Force -Path $workspace | Out-Null
          $link = New-Item -ItemType Junction -Path (Join-Path $workspace "outside-link") -Target $outside
          Write-Host "Junction: $($link.FullName) -> $outside"

      - name: Uninstall Soulstream (Windows PowerShell 5.1, Restricted policy)
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Restricted -Force
          Write-Host "Shell: Windows PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition)), execution policy $(Get-ExecutionPolicy)"
          $uninstaller = Get-Content -Raw -Encoding UTF8 .\install\uninstall-windows.ps1
          & ([scriptblock]::Create($uninstaller)) -NonInteractive -PostgresPassword root -InstallRoot $env:SOULSTREAM_TEST_ROOT
          if (Get-ScheduledTask -TaskName "SoulstreamServer" -ErrorAction SilentlyContinue) { throw "The logon task is still registered." }
          if (Test-Path -LiteralPath $env:SOULSTREAM_TEST_ROOT) { throw "The install folder is still there." }
          foreach ($port in @(5200, 4200, 4205)) {
            if (Get-NetTCPConnection -State Listen -LocalPort $port -ErrorAction SilentlyContinue) { throw "Port $port is still listening." }
          }
          $outsideKeep = Join-Path $env:RUNNER_TEMP "outside-target\keep.txt"
          if (-not (Test-Path -LiteralPath $outsideKeep) -or (Get-Content -LiteralPath $outsideKeep) -ne "keep") {
            throw "The uninstaller deleted $outsideKeep through the workspace junction."
          }
          Write-Host "Junction check: $outsideKeep is still there after the uninstall."
          Write-Host "Soulstream is removed."

      - name: Remove the stand-in user logins
        if: always()
        shell: pwsh
        run: |
          foreach ($file in @(".claude\.credentials.json", ".codex\auth.json")) {
            Remove-Item -LiteralPath (Join-Path $env:USERPROFILE $file) -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Removed the stand-in user logins."
