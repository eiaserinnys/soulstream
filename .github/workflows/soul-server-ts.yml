name: Soul Server TypeScript

env:
  PNPM_VERSION: '10.32.1'

on:
  push:
    branches: [main]
    paths:
      - 'soul-server-ts/src/**'
      - 'soul-server-ts/tests/**'
      - 'soul-server-ts/package.json'
      - 'soul-server-ts/tsconfig*.json'
      - 'soul-server-ts/vitest.config.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/soul-server-ts.yml'
  pull_request:
    paths:
      - 'soul-server-ts/src/**'
      - 'soul-server-ts/tests/**'
      - 'soul-server-ts/package.json'
      - 'soul-server-ts/tsconfig*.json'
      - 'soul-server-ts/vitest.config.ts'
      - 'pnpm-lock.yaml'
      - '.github/workflows/soul-server-ts.yml'

permissions:
  contents: read

jobs:
  soul-server-ts:
    name: soul-server-ts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install repository dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false

      - name: Typecheck soul-server-ts
        run: corepack pnpm --dir soul-server-ts typecheck

      - name: Test soul-server-ts
        run: >-
          corepack pnpm --dir soul-server-ts exec vitest run
          --minWorkers=1 --maxWorkers=2
          --exclude 'tests/runner/*_full_slice_postgres.test.ts'

      - name: Test PostgreSQL full slices sequentially
        run: >-
          corepack pnpm --dir soul-server-ts exec vitest run
          tests/runner/p0r2_resume_writer_lock_full_slice_postgres.test.ts
          tests/runner/r16_terminal_status_full_slice_postgres.test.ts
          tests/runner/r25b_ghost_running_full_slice_postgres.test.ts
          tests/runner/r25c_startup_recovery_full_slice_postgres.test.ts
          tests/runner/r26_resumed_terminal_wiring_full_slice_postgres.test.ts
          tests/runner/s1_s2_restart_resume_full_slice_postgres.test.ts
          tests/runner/s4_new_session_full_slice_postgres.test.ts
          --minWorkers=1 --maxWorkers=1 --no-file-parallelism

  runner-kernel-lock-windows:
    name: runner kernel lock (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install repository dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false

      - name: Verify Windows kernel lock contracts
        shell: bash
        run: >-
          corepack pnpm --dir soul-server-ts exec vitest run
          tests/runner/runner_kernel_lock.test.ts
          tests/runner/runner_writer_lock_liveness.test.ts
          --minWorkers=1 --maxWorkers=2
