name: DB schema

env:
  PNPM_VERSION: '10.32.1'

on:
  push:
    branches: [main]
    paths:
      - 'packages/db-schema/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/db-schema.yml'
  pull_request:
    paths:
      - 'packages/db-schema/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/db-schema.yml'

permissions:
  contents: read

jobs:
  db-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: schema_test
          POSTGRES_PASSWORD: schema_test
          POSTGRES_DB: db_schema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://schema_test:schema_test@127.0.0.1:5432/db_schema_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Node dependencies
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts --filter @soulstream/db-schema...
      - name: Install Python test dependencies
        run: python -m pip install -r packages/db-schema/tests/requirements.txt
      - name: Test schema and migrations
        run: python -m pytest packages/db-schema/tests -q
