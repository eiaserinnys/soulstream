name: S4 claude one-shot diagnostic
run-name: S4 claude diagnostic for 00ae51e6 (single approved run)

# Branch-only version of an already registered workflow_dispatch entry.
# main and the product PR retain their original workflow definitions.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: '10.32.1'

jobs:
  s4-claude-diagnostic:
    if: github.ref == 'refs/heads/diagnostic/card-s4-ci-once'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated diagnostic commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup exact failed-CI Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'

      - name: Verify source and runner, preserve nonsecret environment evidence
        shell: bash
        run: |
          python3 - <<'PYENV'
          import json, os, subprocess
          from pathlib import Path
          target = Path('soul-server-ts/test-artifacts/s4-ci-diagnostic')
          target.mkdir(parents=True, exist_ok=True)
          record = {'sourceSha': '00ae51e6c99e7744a584810f326607374c8a1e44',
                    'diagnosticSha': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                    'parentSha': subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip(),
                    'node': subprocess.check_output(['node','--version'],text=True).strip(),
                    'imageOS': os.environ.get('ImageOS'), 'imageVersion': os.environ.get('ImageVersion')}
          (target/'environment.json').write_text(json.dumps(record,indent=2)+'\n')
          assert record['parentSha'] == record['sourceSha']
          assert record['node'] == 'v22.23.3'
          assert record['imageOS'] == 'ubuntu24' and record['imageVersion'] == '20260927.320.1'
          PYENV

      - name: Install identical frozen repository dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Preserve exact failed-CI PostgreSQL image
        shell: bash
        run: |
          docker pull postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          docker tag postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea postgres:16-alpine
          docker image inspect postgres:16-alpine --format '{"id":{{json .Id}},"repoDigests":{{json .RepoDigests}}}' > soul-server-ts/test-artifacts/s4-ci-diagnostic/postgres-image.json

      - name: Collector import, temporary SQLite read-close-output smoke
        run: python3 scripts/diagnostics/run_s4_ci.py smoke

      - name: Single S4 claude case (only after smoke success)
        run: python3 scripts/diagnostics/run_s4_ci.py s4

      - name: Always upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s4-claude-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: soul-server-ts/test-artifacts/s4-ci-diagnostic/
          if-no-files-found: error
          retention-days: 7
