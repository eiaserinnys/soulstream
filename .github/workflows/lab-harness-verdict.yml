name: lab harness verdict

# scripts/lab-node/ 변경 시 랩 판정기의 자기 증명 테스트를 돌린다.
#
# 이 워크플로가 있는 이유: 하니스는 발화할 수 없는 판정기(`user_message_loss`,
# 함수 파라미터를 읽었다)를 달고 하루치 판단의 근거가 됐다. 상설 테스트로
# 남겼어도 아무도 돌리지 않으면 같은 일이 반복된다.
#
# 여기서 도는 것은 랩이 필요 없는 순수 테스트뿐이다. DB에 위반 행을 심는
# 변이 게이트(`fault-harness.sh mutation`)는 살아 있는 랩이 있어야 하므로
# CI에서 돌 수 없다 — 랩 노드에서 수동으로 돌린다.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/lab-node/**'
      - '.github/workflows/lab-harness-verdict.yml'
  pull_request:
    paths:
      - 'scripts/lab-node/**'
      - '.github/workflows/lab-harness-verdict.yml'
  workflow_dispatch:

jobs:
  verdict-self-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verdict and harness contract tests
        working-directory: scripts/lab-node
        run: |
          node --test --test-concurrency=1 \
            fault-harness.test.mjs \
            fault-harness-verdict.test.mjs \
            lab-node.test.mjs
