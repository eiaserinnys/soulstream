name: Workspace validation

env:
  PNPM_VERSION: '10.32.1'

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'unified-dashboard/**'
      - 'soul-desktop/**'
      - 'soul-server-ts/**'
      - 'orch-server-ts/**'
      - 'chrome-extension/**'
      - 'scripts/tests/**'
      - 'scripts/verify-*.mjs'
      - 'scripts/check-ui-css.mjs'
      - 'scripts/check-ui-css.test.mjs'
      - 'scripts/ui-css-check.config.json'
      - 'scripts/ui-css-baseline.json'
      - 'scripts/check-source-guards.mjs'
      - 'scripts/check-source-guards.test.mjs'
      - 'scripts/source-guards.config.json'
      - 'scripts/check-ts-guards.mjs'
      - 'scripts/check-ts-guards.test.mjs'
      - 'deploy/haniel/build-core.sh'
      - 'deploy/haniel/pack_portable_node_release.sh'
      - 'deploy/macos/check-macos-node.sh'
      - 'deploy/haniel/build_core_darwin.py'
      - 'deploy/haniel/test_build_core_darwin.py'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'packages/**'
      - 'unified-dashboard/**'
      - 'soul-desktop/**'
      - 'soul-server-ts/**'
      - 'orch-server-ts/**'
      - 'chrome-extension/**'
      - 'scripts/tests/**'
      - 'scripts/verify-*.mjs'
      - 'scripts/check-ui-css.mjs'
      - 'scripts/check-ui-css.test.mjs'
      - 'scripts/ui-css-check.config.json'
      - 'scripts/ui-css-baseline.json'
      - 'scripts/check-source-guards.mjs'
      - 'scripts/check-source-guards.test.mjs'
      - 'scripts/source-guards.config.json'
      - 'scripts/check-ts-guards.mjs'
      - 'scripts/check-ts-guards.test.mjs'
      - 'deploy/haniel/build-core.sh'
      - 'deploy/haniel/pack_portable_node_release.sh'
      - 'deploy/macos/check-macos-node.sh'
      - 'deploy/haniel/build_core_darwin.py'
      - 'deploy/haniel/test_build_core_darwin.py'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: orch-server-ts unit tests
            package: orch-server-ts
            kind: unit
          - name: orch-server-ts PostgreSQL tests
            package: orch-server-ts
            kind: postgres
          - name: soul-ui tests
            package: packages/soul-ui
            kind: unit
          - name: unified-dashboard tests
            package: unified-dashboard
            kind: unit
          - name: page-model tests
            package: packages/page-model
            kind: unit
          - name: chat-ui contract tests
            package: packages/chat-ui
            kind: unit
          - name: chrome-extension tests
            package: chrome-extension
            kind: unit
          - name: soul-desktop tests
            package: soul-desktop
            kind: unit
          - name: search-contract tests
            package: packages/search-contract
            kind: unit
          - name: script tests
            package: scripts
            kind: unit
          - name: Haniel build tests
            package: deploy/haniel
            kind: python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile

      - name: Setup Python 3.11
        if: matrix.kind == 'python'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        if: matrix.kind == 'python'
        run: python -m pip install -r packages/db-schema/tests/requirements.txt

      - name: Run package tests
        shell: bash
        run: |
          if [[ "${{ matrix.kind }}" == "postgres" ]]; then
            shopt -s globstar nullglob
            postgres_tests=(
              orch-server-ts/tests/**/*-postgres.test.ts
              orch-server-ts/tests/**/*.postgres.test.ts
              orch-server-ts/tests/**/*.postgres.integration.test.ts
            )
            for index in "${!postgres_tests[@]}"; do
              postgres_tests[$index]="${postgres_tests[$index]#orch-server-ts/}"
            done
            corepack pnpm --dir orch-server-ts exec vitest run \
              "${postgres_tests[@]}" \
              --minWorkers=1 --maxWorkers=1 --no-file-parallelism
          elif [[ "${{ matrix.package }}" == "orch-server-ts" ]]; then
            corepack pnpm --dir orch-server-ts exec vitest run \
              --minWorkers=1 --maxWorkers=2 \
              --exclude '**/*-postgres.test.ts' \
              --exclude '**/*.postgres.test.ts' \
              --exclude '**/*.postgres.integration.test.ts'
          elif [[ "${{ matrix.package }}" == "packages/soul-ui" ]]; then
            corepack pnpm --dir packages/soul-ui exec vitest run \
              --config vitest.config.ts --minWorkers=1 --maxWorkers=2
          elif [[ "${{ matrix.package }}" == "unified-dashboard" ]]; then
            corepack pnpm --dir unified-dashboard exec vitest run \
              --config vitest.config.ts --minWorkers=1 --maxWorkers=2
          elif [[ "${{ matrix.package }}" == "chrome-extension" || "${{ matrix.package }}" == "soul-desktop" ]]; then
            corepack pnpm --dir "${{ matrix.package }}" exec vitest run --minWorkers=1 --maxWorkers=2 --testTimeout=60000
          elif [[ "${{ matrix.package }}" == "packages/search-contract" ]]; then
            corepack pnpm --dir packages/search-contract test
          elif [[ "${{ matrix.package }}" == "scripts" ]]; then
            node --test scripts/tests/verify_bundle_load.test.mjs scripts/verify-workspace-bundle.test.mjs scripts/check-ui-css.test.mjs scripts/check-source-guards.test.mjs scripts/check-ts-guards.test.mjs
          elif [[ "${{ matrix.kind }}" == "python" ]]; then
            python -m pytest deploy/haniel/test_build_core_darwin.py -q --timeout=60
          elif [[ "${{ matrix.package }}" == "packages/chat-ui" ]]; then
            corepack pnpm --dir packages/chat-ui exec vitest run \
              --minWorkers=1 --maxWorkers=2 --testTimeout=60000
          else
            corepack pnpm --dir packages/page-model exec vitest run \
              --minWorkers=1 --maxWorkers=2
          fi

  workspace-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install workspace dependencies
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          corepack pnpm install --frozen-lockfile

      - name: Typecheck active TypeScript packages
        run: corepack pnpm --filter '*' --recursive --if-present typecheck

      - name: Check UI CSS baseline
        run: node scripts/check-ui-css.mjs

      - name: Check source guards
        run: node scripts/check-source-guards.mjs

      - name: Check TypeScript guards
        run: >-
          node scripts/check-ts-guards.mjs
          chrome-extension/tsconfig.json
          orch-server-ts/tsconfig.json
          packages/chat-ui/tsconfig.json
          packages/mcp-contract/tsconfig.json
          packages/page-model/tsconfig.json
          packages/soul-ui/tsconfig.json
          soul-desktop/tsconfig.json
          soul-server-ts/tsconfig.contracts.json
          soul-server-ts/tsconfig.typecheck.json
          unified-dashboard/tsconfig.json

      - name: Build orch-server-ts bundle (includes verify:bundle)
        run: corepack pnpm --dir orch-server-ts build

      - name: Build soul-server-ts bundle (includes verify:bundle)
        env:
          SOULSTREAM_NODE_ID: release-test
          SOULSTREAM_UPSTREAM_URL: ws://127.0.0.1:5200/ws/node
          EVENT_OUTBOX_DIR: .local/event-outbox
        run: corepack pnpm --dir soul-server-ts build

      - name: Build desktop package
        run: corepack pnpm --dir soul-desktop build

      - name: Verify CI maintenance contract
        run: >-
          corepack pnpm --dir soul-server-ts exec vitest run
          tests/scripts/ci_maintenance_contract.test.ts
          --maxWorkers=2 --minWorkers=1

      - name: Install Chromium for dashboard smoke
        run: corepack pnpm --dir unified-dashboard exec playwright install --with-deps chromium

      - name: Run dashboard browser smoke
        run: corepack pnpm --dir unified-dashboard test:e2e:smoke

      - name: Upload dashboard smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-smoke-failure-artifacts
          path: unified-dashboard/e2e/test-results/smoke
          if-no-files-found: ignore
          retention-days: 7
