name: Soul app iOS PAS layout

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'soul-app/native-review/**'
      - 'soul-app/metro.config.js'
      - 'soul-app/metro.config.test.js'
      - 'soul-app/src/screens/PersistentSessionScreen.tsx'
      - 'soul-app/src/components/chat/ChatBody.tsx'
      - 'soul-app/src/components/persistent/**'
      - '.github/workflows/soul-app-ios-pas-layout.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 150
    defaults:
      run:
        working-directory: soul-app
    env:
      NODE_ENV: development
      SOUL_APP_NATIVE_REVIEW: '1'
      ENTRY_FILE: ${{ github.workspace }}/soul-app/native-review/pas-card-entry.tsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: soul-app/package-lock.json
      - name: Install independent app dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Prebuild iOS app
        run: npx expo prebuild --platform ios --clean
      - name: Verify generated bundle phase accepts ENTRY_FILE
        run: |
          grep -F 'if [[ -z \"$ENTRY_FILE\" ]]' ios/Soulstream.xcodeproj/project.pbxproj
          test -f "$ENTRY_FILE"
          echo "Harness entry: $ENTRY_FILE"
      - name: Build Release simulator app
        run: >-
          xcodebuild -workspace ios/Soulstream.xcworkspace
          -scheme Soulstream
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package simulator app
        run: ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/Soulstream.app Soulstream.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pas-layout-app
          path: soul-app/Soulstream.app.zip
          retention-days: 7

  capture:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPad Pro 13-inch (M5)
            runtime: '27.0'
            artifact: ipad-pro-13
            displays: ''
          - device: iPhone 17
            runtime: '27.0'
            artifact: iphone-17
            displays: ''
          - device: iPhone Duo
            runtime: '27.1'
            artifact: iphone-duo
            displays: '1 3'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pas-layout-app
      - name: Unpack simulator app
        run: unzip Soulstream.app.zip
      - name: Find or create simulator
        id: simulator
        env:
          SIMULATOR_RUNTIME: ${{ matrix.runtime }}
          SIMULATOR_DEVICE: ${{ matrix.device }}
        run: |
          cat > "$RUNNER_TEMP/find_pas_simulator.py" <<'PY'
          import json
          import subprocess
          import sys

          version, name = sys.argv[1:]
          token = f"iOS-{version.replace('.', '-')}"
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          for runtime, items in devices.items():
              if token in runtime:
                  for item in items:
                      if item['name'] == name and item.get('isAvailable', True):
                          print(item['udid'])
                          raise SystemExit(0)
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']))['runtimes']
          runtime = next(item for item in runtimes if item.get('name') == f'iOS {version}' and item.get('isAvailable', True))
          types = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']
          device_type = next(item for item in types if item['name'] == name)
          print(subprocess.check_output(['xcrun', 'simctl', 'create', name, device_type['identifier'], runtime['identifier']], text=True).strip())
          PY
          udid=$(python3 "$RUNNER_TEMP/find_pas_simulator.py" "$SIMULATOR_RUNTIME" "$SIMULATOR_DEVICE")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Simulator UDID: $udid"
      - name: Boot simulator
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.udid }}'
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
      - name: Try to unfold Duo and list Simulator menu items
        if: matrix.device == 'iPhone Duo'
        continue-on-error: true
        run: |
          open -a Simulator --args -CurrentDeviceUDID '${{ steps.simulator.outputs.udid }}'
          osascript <<'APPLESCRIPT'
          tell application "Simulator" to activate
          delay 3
          tell application "System Events"
            tell process "Simulator"
              set foundItem to false
              repeat with menuBarItem in menu bar items of menu bar 1
                set menuName to name of menuBarItem
                try
                  repeat with menuItem in menu items of menu 1 of menuBarItem
                    set itemName to name of menuItem
                    log (menuName & ": " & itemName)
                    if itemName contains "Unfold" or itemName contains "펼치" then
                      click menuItem
                      set foundItem to true
                      log ("Unfold clicked: " & itemName)
                    end if
                  end repeat
                end try
              end repeat
              if foundItem is false then error "Unfold menu item not found"
            end tell
          end tell
          APPLESCRIPT
      - name: Install app and capture 30-second sequence
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          DISPLAYS: ${{ matrix.displays }}
        run: |
          xcrun simctl install "$SIMULATOR_UDID" Soulstream.app
          mkdir -p captures
          cat > "$RUNNER_TEMP/capture_pas.py" <<'PY'
          import os
          import signal
          import subprocess
          import time

          udid = os.environ['SIMULATOR_UDID']
          displays = os.environ['DISPLAYS'].split() or [None]
          video = subprocess.Popen(['xcrun', 'simctl', 'io', udid, 'recordVideo', 'captures/sequence.mp4'])
          try:
              print(subprocess.check_output(['xcrun', 'simctl', 'launch', udid, 'me.eiaserinnys.soulstream'], text=True).strip(), flush=True)
              start = time.monotonic()
              for second in range(30):
                  time.sleep(max(0, start + second - time.monotonic()))
                  for display in displays:
                      suffix = f'-display-{display}' if display else ''
                      args = ['xcrun', 'simctl', 'io', udid, 'screenshot']
                      if display:
                          args.append(f'--display={display}')
                      subprocess.run(args + [f'captures/{second:02d}s{suffix}.png'], check=True)
              time.sleep(max(0, start + 30 - time.monotonic()))
          finally:
              video.send_signal(signal.SIGINT)
              video.wait(timeout=30)
          if video.returncode != 0:
              raise SystemExit(f'recordVideo failed: {video.returncode}')
          PY
          python3 "$RUNNER_TEMP/capture_pas.py"
      - name: Upload capture sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pas-layout-${{ matrix.artifact }}
          path: captures/
          retention-days: 7
          if-no-files-found: warn
