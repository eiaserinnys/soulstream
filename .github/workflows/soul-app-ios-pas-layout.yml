name: Soul app iOS PAS layout

on:
  push:
    branches: ['ci/duo-rail-956-sim-*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 150
    defaults:
      run:
        working-directory: soul-app
    env:
      NODE_ENV: development
      SOUL_APP_NATIVE_REVIEW: '1'
      ENTRY_FILE: ${{ github.workspace }}/soul-app/native-review/pas-card-entry.tsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: soul-app/package-lock.json
      - name: Install independent app dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Prebuild iOS app
        run: npx expo prebuild --platform ios --clean
      - name: Verify generated bundle phase accepts ENTRY_FILE
        run: |
          grep -F 'if [[ -z \"$ENTRY_FILE\" ]]' ios/Soulstream.xcodeproj/project.pbxproj
          test -f "$ENTRY_FILE"
      - name: Build Release simulator app
        run: >-
          xcodebuild -workspace ios/Soulstream.xcworkspace
          -scheme Soulstream
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package simulator app
        run: ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/Soulstream.app Soulstream.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pas-layout-app
          path: soul-app/Soulstream.app.zip
          retention-days: 7

  capture:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.ref_name == 'ci/duo-rail-956-sim-before' && '[{"scenario":"home-landscape","device":"iPad Pro 13-inch (M5)","runtime":"27.0"},{"scenario":"pas-landscape","device":"iPad Pro 13-inch (M5)","runtime":"27.0"}]' || '[{"scenario":"home-landscape","device":"iPad Pro 13-inch (M5)","runtime":"27.0"},{"scenario":"pas-landscape","device":"iPad Pro 13-inch (M5)","runtime":"27.0"},{"scenario":"pas-portrait","device":"iPad Pro 13-inch (M5)","runtime":"27.0"},{"scenario":"outer-rail-portrait","device":"iPhone Duo","runtime":"27.1"},{"scenario":"outer-rail-landscape","device":"iPhone Duo","runtime":"27.1"}]') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pas-layout-app
      - name: Unpack simulator app
        run: unzip Soulstream.app.zip
      - name: Find or create simulator
        id: simulator
        env:
          SIMULATOR_RUNTIME: ${{ matrix.runtime }}
          SIMULATOR_DEVICE: ${{ matrix.device }}
        run: |
          cat > "$RUNNER_TEMP/find_pas_simulator.py" <<'PY'
          import json
          import subprocess
          import sys

          version, name = sys.argv[1:]
          token = f"iOS-{version.replace('.', '-')}"
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          for runtime, items in devices.items():
              if token in runtime:
                  for item in items:
                      if item['name'] == name and item.get('isAvailable', True):
                          print(item['udid'])
                          raise SystemExit(0)
          runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']))['runtimes']
          runtime = next(item for item in runtimes if item.get('name') == f'iOS {version}' and item.get('isAvailable', True))
          types = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']
          device_type = next(item for item in types if item['name'] == name)
          print(subprocess.check_output(['xcrun', 'simctl', 'create', name, device_type['identifier'], runtime['identifier']], text=True).strip())
          PY
          udid=$(python3 "$RUNNER_TEMP/find_pas_simulator.py" "$SIMULATOR_RUNTIME" "$SIMULATOR_DEVICE")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "Simulator UDID: $udid"
      - name: Boot simulator
        run: |
          xcrun simctl boot '${{ steps.simulator.outputs.udid }}'
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
      - name: Capture scenario sequence
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          PAS_SCENARIO: ${{ matrix.scenario }}
          SKIP_IPAD_ROTATION: ${{ matrix.device == 'iPad Pro 13-inch (M5)' }}
        run: |
          xcrun simctl install "$SIMULATOR_UDID" Soulstream.app
          mkdir -p captures
          cat > "$RUNNER_TEMP/capture_pas.py" <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import time

          udid = os.environ['SIMULATOR_UDID']
          scenario = os.environ['PAS_SCENARIO']
          output = Path('captures')
          subprocess.run(['xcrun', 'simctl', 'terminate', udid, 'me.eiaserinnys.soulstream'],
                         stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
          try:
              subprocess.run(['xcrun', 'simctl', 'io', udid, 'screenshot', '--display=1', str(output / 'warmup.png')],
                             capture_output=True, text=True, check=False, timeout=30)
          except subprocess.TimeoutExpired:
              print('Warmup screenshot timed out', flush=True)
          started = time.monotonic()
          args = ['xcrun', 'simctl', 'launch', udid, 'me.eiaserinnys.soulstream', '-pasHarnessScenario', scenario]
          if os.environ['SKIP_IPAD_ROTATION'] == 'true':
              args.extend(['-pasHarnessSkipRotation', 'true'])
          result = subprocess.check_output(args, text=True, timeout=60)
          print(result.strip(), flush=True)
          while (elapsed := time.monotonic() - started) < 260:
              second = int(elapsed)
              path = output / f't{second:03d}.png'
              try:
                  capture = subprocess.run(['xcrun', 'simctl', 'io', udid, 'screenshot', '--display=1', str(path)],
                                           capture_output=True, text=True, check=False, timeout=30)
              except subprocess.TimeoutExpired:
                  print(f'{scenario} {path.name} timed out after 30s', flush=True)
                  continue
              print(f'{scenario} {path.name} elapsed={time.monotonic()-started:.1f}s exit={capture.returncode} {capture.stderr.strip()}', flush=True)
              if capture.returncode:
                  raise SystemExit(capture.returncode)
              time.sleep(max(0, 5 - (time.monotonic() - started - elapsed)))
          PY
          python3 "$RUNNER_TEMP/capture_pas.py"
      - name: Collect simulator diagnostics
        if: always()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p captures/diagnostics
          if [ -n "$SIMULATOR_UDID" ]; then
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 15m --style compact \
              --predicate 'process == "Soulstream"' > captures/diagnostics/app.log 2>&1 || true
            crash_dir="$HOME/Library/Developer/CoreSimulator/Devices/$SIMULATOR_UDID/data/Library/Logs/CrashReporter"
            find "$crash_dir" -maxdepth 1 -type f -iname '*Soulstream*' -exec cp {} captures/diagnostics/ \; 2>/dev/null || true
          fi
      - name: Upload capture sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pas-layout-${{ matrix.scenario }}
          path: captures/
          retention-days: 7
          if-no-files-found: warn
