name: Soul app iOS PAS layout

on:
  push:
    branches: ['ci/duo-top-band-1019-sim']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 150
    defaults:
      run:
        working-directory: soul-app
    env:
      NODE_ENV: development
      SOUL_APP_NATIVE_REVIEW: '1'
      ENTRY_FILE: ${{ github.workspace }}/soul-app/native-review/pas-card-entry.tsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: soul-app/package-lock.json
      - name: Install independent app dependencies
        run: npm ci --include=dev --no-audit --no-fund
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version
      - name: Prebuild iOS app
        run: npx expo prebuild --platform ios --clean
      - name: Verify generated bundle phase accepts ENTRY_FILE
        run: |
          grep -F 'if [[ -z \"$ENTRY_FILE\" ]]' ios/Soulstream.xcodeproj/project.pbxproj
          test -f "$ENTRY_FILE"
      - name: Build Release simulator app
        run: >-
          xcodebuild -workspace ios/Soulstream.xcworkspace
          -scheme Soulstream
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Package simulator app
        run: ditto -c -k --keepParent build/Build/Products/Release-iphonesimulator/Soulstream.app Soulstream.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pas-layout-app
          path: soul-app/Soulstream.app.zip
          retention-days: 7

  capture:
    needs: build
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: pas-layout-app
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Unpack simulator app
        run: unzip Soulstream.app.zip
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Find simulator
        id: simulator
        run: |
          cat > "$RUNNER_TEMP/find_simulator.py" <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import os

          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          choices = [(runtime, device) for runtime, items in devices.items() if 'iOS' in runtime
                     for device in items if device.get('isAvailable', True)]
          minis = [(runtime, device) for runtime, device in choices if 'iPad mini' in device['name']]
          fallback = [(runtime, device) for runtime, device in choices if device['name'] == 'iPad Pro 13-inch (M5)']
          if minis or fallback:
              runtime, device = (minis or fallback)[0]
          else:
              runtimes = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'runtimes', '-j']))['runtimes']
              types = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devicetypes', '-j']))['devicetypes']
              runtime_info = next(item for item in runtimes if item['name'] == 'iOS 27.0' and item.get('isAvailable', True))
              device_type = next(item for item in types if item['name'] == 'iPad Pro 13-inch (M5)')
              udid = subprocess.check_output(['xcrun', 'simctl', 'create', device_type['name'], device_type['identifier'], runtime_info['identifier']], text=True).strip()
              runtime, device = runtime_info['identifier'], {'name': device_type['name'], 'udid': udid, 'state': 'Shutdown'}
          state = device.get('state', 'unknown')
          print(f"Using {device['name']} {runtime}, {device['udid']} ({state})", flush=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"udid={device['udid']}\n")
              output.write(f"state={state}\n")
          Path('captures').mkdir(exist_ok=True)
          Path('captures/device.json').write_text(json.dumps({'runtime': runtime, 'name': device['name'], 'udid': device['udid']}, indent=2))
          PY
          python3 "$RUNNER_TEMP/find_simulator.py"
      - name: Boot simulator
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          SIMULATOR_STATE: ${{ steps.simulator.outputs.state }}
        run: |
          if [ "$SIMULATOR_STATE" != "Booted" ]; then xcrun simctl boot "$SIMULATOR_UDID"; fi
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Capture home portrait and tap native controls
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcrun simctl install "$SIMULATOR_UDID" Soulstream.app
          xcrun simctl terminate "$SIMULATOR_UDID" me.eiaserinnys.soulstream || true
          xcrun simctl launch "$SIMULATOR_UDID" me.eiaserinnys.soulstream -pasHarnessScenario home-portrait
          sleep 12
          capture_phase() {
            xcrun simctl io "$SIMULATOR_UDID" screenshot --display=1 "captures/$1.png"
            maestro --device="$SIMULATOR_UDID" hierarchy > "captures/$1-hierarchy.json" || true
          }
          capture_phase band
          for phase in menu settings search; do
            maestro --device="$SIMULATOR_UDID" test --debug-output="captures/debug-$phase" "soul-app/native-review/home-portrait-$phase.yaml"
            if [ "$phase" = menu ]; then capture_phase drawer; else capture_phase "$phase"; fi
          done
      - name: Collect simulator diagnostics
        if: always()
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          mkdir -p captures/diagnostics
          if [ -n "$SIMULATOR_UDID" ]; then
            xcrun simctl spawn "$SIMULATOR_UDID" log show --last 15m --style compact \
              --predicate 'process == "Soulstream"' > captures/diagnostics/app.log 2>&1 || true
          fi
      - name: Upload capture sequence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-portrait-native
          path: captures/
          retention-days: 7
          if-no-files-found: warn
          include-hidden-files: true
