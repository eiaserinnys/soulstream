name: CI paths

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-ci-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check workflow paths filters
        run: node .github/scripts/check-ci-paths.mjs

      - name: Test workflow paths checker
        run: node --test .github/scripts/check-ci-paths.test.mjs
