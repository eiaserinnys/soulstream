# HTTP (port 80) twin of external-access-link.conf for the
# soulstream.eiaserinnys.me server block. Installation is described in
# README.md.
#
# The current server block answers every request with a server-level
#
#     return 301 https://soulstream.eiaserinnys.me$request_uri;
#
# A server-level return runs before location matching, so the location below
# would never run and the key would still reach soulstream-diagnostic.log.
# When installing, move that return into `location /` and include this file:
#
#     large_client_header_buffers 4 16k;
#     include /etc/nginx/snippets/soulstream-external-access-link-http.conf;
#     location / {
#         return 301 https://soulstream.eiaserinnys.me$request_uri;
#     }
#
location ^~ /x/ {
    access_log off;
    error_log /dev/null;
    return 301 https://$host$request_uri;
}
