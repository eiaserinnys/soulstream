# Include inside the soulstream.eiaserinnys.me HTTPS server block, alongside
# the existing locations. Installation is described in README.md.
#
# An external access link keeps its key in the URL path (/x/<key>), so the
# request line and $uri carry it. This location keeps that key out of the
# nginx logs for the requests it handles. Requests rejected before a location
# is selected (oversized header line, header timeout) are not covered.
#
# Do not add proxy_intercept_errors or error_page here: /x/ must not be turned
# into the dashboard index. The `^~` prefix also keeps the regex locations of
# the dashboard snippet from claiming these requests.
location ^~ /x/ {
    # The inherited server-level soulstream_diagnostic log ($uri) and the
    # http-level combined log ($request) both contain the key. Turn off all
    # inherited access logs for this location.
    access_log off;

    # Upstream failures (502, 504) and nginx rejections such as 413 write an
    # error line that quotes the full request line, key included. Discard them.
    error_log /dev/null;

    proxy_pass http://netcup_core_soulstream_orchestrator;
    include /etc/nginx/snippets/netcup-core-proxy.conf;

    # The app caps link message bodies at 256KiB. Leave headroom so an ordinary
    # oversize request gets the app's JSON 413, not nginx's HTML page.
    client_max_body_size 320k;

    # Link reads long-poll for up to 25 seconds. The included
    # netcup-core-proxy.conf already sets proxy_read_timeout 3600s, well above
    # that. It cannot be re-specified here: nginx rejects a second
    # proxy_read_timeout in the same context as "directive is duplicate", even
    # when the first one comes from an include.
}
