# Include inside the existing soulstream HTTPS server block. Keep /lab/ as-is.
# The root must match orch DASHBOARD_DIR for this deployment.
root /home/eias/migration/netcup-core-bootstrap/production-staging/repo/unified-dashboard/dist;

location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ^~ /fonts/ {
    try_files $uri =404;
}
location ~ ^/(sw\.js|sw-update-migration\.js|registerSW\.js|workbox-[a-zA-Z0-9-]+\.js|manifest\.webmanifest|build-info\.json|favicon\.png|icon-192\.png|icon-512\.png|system-portrait\.png)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
}

# APIs, authentication callbacks and persistent connections retain proxy errors.
location ^~ /api/ {
    proxy_pass http://netcup_core_soulstream_orchestrator;
    include /etc/nginx/snippets/netcup-core-proxy.conf;
}
location ^~ /ws/ {
    proxy_pass http://netcup_core_soulstream_orchestrator;
    include /etc/nginx/snippets/netcup-core-proxy.conf;
}
location ^~ /yjs/ {
    proxy_pass http://netcup_core_soulstream_orchestrator;
    include /etc/nginx/snippets/netcup-core-proxy.conf;
}
location ~ ^/(cogito|mcp|auth|login|claude|oauth|callback)(/|$) {
    proxy_pass http://netcup_core_soulstream_orchestrator;
    include /etc/nginx/snippets/netcup-core-proxy.conf;
}

location = /__dashboard_connection_index {
    internal;
    default_type text/html;
    alias /home/eias/migration/netcup-core-bootstrap/production-staging/repo/unified-dashboard/dist/index.html;
    add_header Cache-Control "no-cache";
}
location / {
    proxy_pass http://netcup_core_soulstream_orchestrator;
    include /etc/nginx/snippets/netcup-core-proxy.conf;
    proxy_intercept_errors on;
    error_page 502 503 504 =200 /__dashboard_connection_index;
}
